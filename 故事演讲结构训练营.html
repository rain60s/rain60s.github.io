<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事演讲结构训练营 · 14天从"套不顺"到"随手能讲"</title>
<style>
  :root{
    --bg:#fbf7f0;
    --card:#ffffff;
    --ink:#2f2a26;
    --muted:#8a8178;
    --line:#ece3d6;
    --amber:#e8943a;
    --amber-soft:#fbe9d2;
    --teal:#3a8e8a;
    --teal-soft:#d8efed;
    --pink:#d96a7a;
    --pink-soft:#f7dde2;
    --shadow:0 6px 22px rgba(120,90,50,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  /* layout */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{font-size:18px;font-weight:800;color:var(--amber);margin-bottom:4px}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  .nav{margin-top:22px;display:flex;flex-direction:column;gap:4px}
  .nav button{
    text-align:left;background:none;border:none;cursor:pointer;font-size:14px;
    color:var(--ink);padding:9px 12px;border-radius:10px;font-family:inherit;
    display:flex;align-items:center;gap:9px;transition:.15s;
  }
  .nav button:hover{background:var(--amber-soft)}
  .nav button.active{background:var(--amber);color:#fff;font-weight:600}
  .nav .ico{width:18px;text-align:center}
  .progress-wrap{margin-top:24px;background:var(--bg);border-radius:12px;padding:14px}
  .progress-wrap .ptitle{font-size:12px;color:var(--muted);margin-bottom:8px}
  .bar{height:9px;background:#eee;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f0b06a);width:0;transition:.4s}
  .pnum{font-size:13px;font-weight:700;margin-top:8px;color:var(--amber)}
  .main{flex:1;padding:34px 40px;max-width:920px;margin:0 auto}
  @media(max-width:820px){.sidebar{display:none}.main{padding:20px 16px}}

  /* home */
  .hero{background:linear-gradient(135deg,#fff,#fdf3e6);border:1px solid var(--line);
    border-radius:18px;padding:30px 32px;box-shadow:var(--shadow);margin-bottom:26px}
  .hero h1{font-size:26px;line-height:1.35;margin-bottom:10px}
  .hero p{color:#5f574e;font-size:15px;max-width:640px}
  .hero .tag{display:inline-block;background:var(--amber-soft);color:var(--amber);
    font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;margin-bottom:14px}
  .map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
    cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .daycard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--amber)}
  .daycard .dn{font-size:12px;color:var(--muted);font-weight:600}
  .daycard h3{font-size:15px;margin:6px 0 4px;line-height:1.4}
  .daycard .ds{font-size:12.5px;color:var(--muted);min-height:34px}
  .daycard .done{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;
    background:var(--teal);color:#fff;font-size:13px;display:none;align-items:center;justify-content:center}
  .daycard.finished .done{display:flex}
  .daycard.finished{border-color:var(--teal-soft);background:linear-gradient(135deg,#fff,#f1faf8)}
  .sectitle{font-size:18px;font-weight:800;margin:30px 0 16px;display:flex;align-items:center;gap:8px}

  /* lesson */
  .lesson h2{font-size:23px;margin-bottom:6px}
  .lesson .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
  .block h4{font-size:16px;margin-bottom:10px;color:var(--amber)}
  .block p{margin-bottom:10px;color:#463f37}
  .block ul{margin:6px 0 10px 20px}
  .block li{margin-bottom:6px;color:#463f37}
  .coreline{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 12px 12px 0;
    padding:14px 18px;margin:6px 0 16px;font-weight:600;color:#7a4a18}
  .example{background:#f7f4ef;border-radius:12px;padding:14px 16px;font-size:14px;color:#5a524a;margin:10px 0;
    border:1px dashed var(--line)}
  .example b{color:var(--teal)}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:680px){.twocol{grid-template-columns:1fr}}
  .pill{display:inline-block;background:var(--teal-soft);color:var(--teal);font-size:12px;
    font-weight:700;padding:3px 10px;border-radius:99px;margin:2px 4px 2px 0}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.pink{background:var(--pink-soft);color:var(--pink)}

  /* exercise */
  .exercise{background:linear-gradient(135deg,#fff,#fdeef0);border:1px solid var(--pink-soft);border-radius:14px;padding:22px 24px;margin:8px 0 18px}
  .exercise h4{color:var(--pink);font-size:16px;margin-bottom:10px}
  .exercise p{color:#5a4a4e;font-size:14px;margin-bottom:12px}
  textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;
    padding:14px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;background:#fffdfb}
  textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .savehint{font-size:12px;color:var(--teal);margin-top:8px;height:16px;transition:.2s}

  /* actions */
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;
    padding:11px 20px;border-radius:11px;transition:.15s}
  .btn.primary{background:var(--amber);color:#fff}
  .btn.primary:hover{background:#d9831f}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--amber)}
  .checkrow{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:14px}
  .checkrow input{width:20px;height:20px;accent-color:var(--teal);cursor:pointer}

  /* diagnosis */
  .wizard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .wstep{margin-bottom:20px}
  .wstep .q{font-size:16px;font-weight:700;margin-bottom:12px}
  .opt{display:block;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;
    margin-bottom:9px;cursor:pointer;transition:.15s;font-size:14px}
  .opt:hover{border-color:var(--amber);background:var(--amber-soft)}
  .opt.sel{border-color:var(--amber);background:var(--amber-soft);font-weight:600}
  .result{background:var(--teal-soft);border-radius:14px;padding:22px;margin-top:18px;display:none}
  .result.show{display:block;animation:fade .4s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .result h3{color:var(--teal);margin-bottom:10px}
  .result .tpl{background:#fff;border-radius:10px;padding:14px;margin:12px 0;font-size:14px;border:1px solid var(--line)}
  .result .tpl b{color:var(--teal)}

  .note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px 16px;margin-top:16px}
  .hidden{display:none}
  .footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🦐 故事演讲训练营<small>14天 · 每天一点进步</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="progress-wrap">
      <div class="ptitle">训练进度</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="pnum"><span id="pnum">0</span> / 14 天 完成</div>
    </div>
  </aside>

  <main class="main" id="view"></main>
</div>

<script>
/* ============ 课程数据 ============ */
const DAYS = [
  {
    n:1, t:"重新理解故事：不止「克服障碍」", s:"为什么你套结构会不顺",
    core:"你套不顺，不是不会套，而是把「行动型」结构用在了「认知/关系/见证型」故事上。",
    blocks:[
      {h:"你的六步结构适合哪类故事？", html:`
        <p>你理解的 <b>想做一件事 → 遇到障碍 → 克服障碍</b>，是典型的 <span class="pill amber">行动型故事</span>。比如：考大学没钱、跑马拉松受伤、创业卖不出货。</p>
        <p>但还有很多故事重点不是「完成任务」，而是 <b>发生改变</b>。所以更完整的定义是：</p>
        <div class="coreline">一个人处于某种状态，因一件事打破了平衡，他不得不回应，并最终发生了某种改变。</div>`},
      {h:"四种故事类型速览", html:`
        <div class="twocol">
          <div><span class="pill amber">行动型</span><p>目标任务型：完成挑战、克服困难。</p></div>
          <div><span class="pill">认知型</span><p>我原以为…后来明白…：观念被推翻。</p></div>
          <div><span class="pill pink">关系型</span><p>两人距离如何变化：误解→理解。</p></div>
          <div><span class="pill">见证型</span><p>你不是主角，只是见证了一个真相。</p></div>
        </div>
        <p>改变的六种形态：处境、能力、关系、认知、身份、价值观。演讲最打动人的往往是后几种。</p>`}
    ],
    exercise:"回想你最近在聊天或演讲里讲过的 <b>3 个真实故事</b>，在下面分别写下它们，并凭直觉猜一猜：它最大的变化是「事情完成了 / 想法变了 / 关系变了 / 揭示了一个真相」中的哪一种？不用准，先建立感觉。"
  },
  {
    n:2, t:"六步功能（上）：悲催与目标的真面目", s:"「悲催」不是惨，「目标」有两层",
    core:"悲催 = 有缺陷的平衡；目标 = 外在目标 + 内在需求。只有事情没有人，故事就套不顺。",
    blocks:[
      {h:"悲催：建立「不平衡」", html:`
        <p>「悲催」不一定是惨，它的作用是告诉听众：<b>主人公现在的生活里，有什么不对劲？</b></p>
        <ul>
          <li><b>外部困境</b>：欠债、考试失败、公司快倒。</li>
          <li><b>内部困境</b>：看起来成功，却怕被看穿；和父亲同住却几乎不说话。</li>
          <li><b>看起来很好实际有问题</b>：「升职加薪买房，所有人都说我成功，只有我知道每天都不想去公司」。</li>
        </ul>
        <p>所以「悲催」更准确的名字是：<b>原有困境，或有缺陷的平衡</b>。</p>`},
      {h:"目标：让听众知道「他想要什么」", html:`
        <p>目标有两个层次：</p>
        <ul>
          <li><b>外在目标</b>：考上大学、拿到订单、向父亲道歉。</li>
          <li><b>内在需求</b>：被认可、安全感、与人连接、接受不完美的自己。</li>
        </ul>
        <div class="example">一个创业者的外在目标是<b>拿到融资</b>，内在需求却是<b>证明「我不是失败者」</b>。好故事通常是：追逐外在目标，过程中发现自己真正缺的是什么。</div>`}
    ],
    exercise:"给你一个情境自己练：<b>「我花三个月准备跳槽，面试却连续被拒。」</b><br>在下面分别写出：① 这个人的外在目标；② 他可能没说出口的内在需求。"
  },
  {
    n:3, t:"六步功能（下）：努力·挫折·转折·结果", s:"努力=选择，挫折=逼出弱点，结果=人的改变",
    core:"故事不关心抽象的「辛苦」，只关心人在压力下做了什么决定。结果要回答「人变成了谁」。",
    blocks:[
      {h:"努力 = 行动与选择", html:`<p>不要说「我每天5点起12点睡」，要说 <b>人在压力下做了什么具体决定</b>：拨通不敢打的电话、把房子抵押、对父亲说出藏了十年的话。</p>`},
      {h:"挫折 = 逼出弱点", html:`
        <p>好挫折带 <b>因果关系</b>，不是「倒霉」：</p>
        <div class="example">弱：「我努力创业，突然遇到经济危机。」<br>强：「为快速扩张，我把所有资金压进库存。三个月后销量下滑，连工资都发不出。」</div>
        <p>最有价值的挫折不是「做得不够多」，而是 <b>「我用错了方法，甚至追错了目标。」</b></p>`},
      {h:"转折 ≠ 突然来好运", html:`<p>生硬转折：「遇到贵人 / 客户突然来电」。更好的三种：<b>行动转折</b>（换做法）、<b>认知转折</b>（突然理解）、<b>身份转折</b>（决定成为不同的人）。</p>`},
      {h:"结果 = 人的改变", html:`<p>结果不一定大获成功。最好含两层：<b>事情的结果</b>（赢了/活下来吗）+ <b>人的结果</b>（变成了谁、相信什么）。<br>例：比赛还是输了，但第一次不为失败找借口。</p>`}
    ],
    exercise:"下面是一段「流水账努力」，请改写得 <b>只保留 3 个关键选择节点</b>（第一次尝试 / 最严重失败 / 最关键选择）：<br><i>「我备考半年，每天刷题，报了3个班，做完了5本练习册，最后还是没考上。」</i><br>在下面重写这三个节点。"
  },
  {
    n:4, t:"第一类：行动型故事", s:"困境→目标→行动→阻碍→突破→结果",
    core:"你最熟悉的结构。适合讲创业、比赛、学习、销售、克服困难的经历。",
    blocks:[
      {h:"结构模板", html:`<div class="tpl" style="background:#f7f4ef;border:1px dashed var(--line);border-radius:10px;padding:14px">
        <b>困境</b> → <b>目标</b> → <b>行动</b> → <b>阻碍</b> → <b>突破</b> → <b>结果</b></div>`},
      {h:"完整示例", html:`<div class="example">
        我第一次做销售，连续一个月没成交。<b>（困境）</b><br>
        我定目标：这月一定要签下第一单。<b>（目标）</b><br>
        我每天打50个电话、拜访10家公司。<b>（行动）</b><br>
        但我越努力，客户拒绝越快。<b>（阻碍）</b><br>
        一位客户问我：「你除了介绍产品，能不能先听我的问题？」<b>（突破）</b><br>
        我改变沟通方式，三天后签下第一单。<b>（结果）</b></div>`}
    ],
    exercise:"用上面的模板，在下面写一件 <b>你自己真实经历过的「完成挑战」</b> 的事，六个环节各填一句。哪怕很小的事也可以（比如学会做一道菜、跑完第一次5公里）。"
  },
  {
    n:5, t:"第二类：认知型故事", s:"旧认知→冲击→坚持→代价→顿悟→新认知",
    core:"没有明确的「目标」，核心是「我原来以为…后来才明白…」。适合管理感悟、人生道理、职业反思。",
    blocks:[
      {h:"结构模板", html:`<div class="tpl" style="background:#f7f4ef;border:1px dashed var(--line);border-radius:10px;padding:14px">
        <b>旧认知</b> → <b>冲击事件</b> → <b>误判/坚持</b> → <b>代价</b> → <b>顿悟</b> → <b>新认知</b></div>`},
      {h:"完整示例", html:`<div class="example">
        我以前认为好领导必须永远比下属更有把握。<b>（旧认知）</b><br>
        项目出严重问题，我明明不知道答案却假装尽在掌握。<b>（冲击）</b><br>
        团队按我的方向忙了两周，问题越来越严重。<b>（坚持/误判）</b><br>
        年轻同事问我：「你是不是其实也不知道？」<b>（代价显现）</b><br>
        我第一次说：「是的，我不知道。」团队反而迅速找到方案。<b>（顿悟）</b><br>
        我才明白：领导力不是永远给答案，而是让真正的答案有机会出现。<b>（新认知）</b></div>`}
    ],
    exercise:"在下面写一件 <b>你观念被改变的真实经历</b>：开头用「我以前以为______」，结尾用「后来才明白______」。中间填冲击、代价、顿悟。"
  },
  {
    n:6, t:"第三类：关系型故事", s:"隔阂→冲突→误解→发现→理解→靠近",
    core:"讲两人距离如何变化。不适合说「我的目标是获得父爱」，那样很别扭。用「误解—冲突—发现—理解」。",
    blocks:[
      {h:"结构模板", html:`<div class="tpl" style="background:#f7f4ef;border:1px dashed var(--line);border-radius:10px;padding:14px">
        <b>关系状态</b> → <b>矛盾/隔阂</b> → <b>尝试沟通</b> → <b>误解加深</b> → <b>看见对方</b> → <b>关系变化</b></div>`},
      {h:"完整示例", html:`<div class="example">
        小时候总觉得父亲不爱我。<b>（状态）</b><br>
        家长会他不去，生日很少送礼物。<b>（隔阂）</b><br>
        毕业典礼我打电话希望他来。<b>（尝试）</b><br>
        他说店里忙来不了，我彻底失望。<b>（误解加深）</b><br>
        母亲交给我一个盒子，装着我小学到大学所有成绩单，每张背面是父亲当天的工作记录。<b>（看见）</b><br>
        毕业典礼后我去了他店里，第一次主动抱他。<b>（关系变化）</b></div>`}
    ],
    exercise:"在下面写一个 <b>你和某个人关系变化的真实故事</b>：可以是家人、朋友、同事，甚至从讨厌到理解的人。重点写出「发现对方另一面」的那个瞬间。"
  },
  {
    n:7, t:"第四类：见证型故事", s:"场景→异常→悬念→揭示→冲击→意义",
    core:"你不是主角，只是见证了一个场景。没有目标/努力/障碍，但靠「正常—异常—揭示—改变」依然成立。",
    blocks:[
      {h:"结构模板", html:`<div class="tpl" style="background:#f7f4ef;border:1px dashed var(--line);border-radius:10px;padding:14px">
        <b>日常场景</b> → <b>反常细节</b> → <b>关注/悬念</b> → <b>真相揭示</b> → <b>情感冲击</b> → <b>意义升华</b></div>`},
      {h:"完整示例", html:`<div class="example">
        医院电梯里看见一位老人，手里两个饭盒。<b>（场景）</b><br>
        到6楼没下，到8楼也没下。<b>（反常）</b><br>
        我忍不住问他去几楼。<b>（悬念）</b><br>
        他说：「哪层都不去，老伴走了，我只是想再走一遍给她送饭的路。」<b>（揭示）</b><br>
        电梯门一次次开合。<b>（冲击）</b><br>
        那天我明白：有些告别不是说句再见就能完成的。<b>（意义）</b></div>`}
    ],

  {

  {

    blocks:[

    exercise:"挑你之前写得最「干」的一句标签式表达（比如「我很紧张」「他很不靠谱」），在下面改写成 <b>一个能让人看见的画面或动作</b>。"
  },
  {

        <li><b>从前是什么状态？</b> 人物、场景、原有平衡。</li>
        <li><b>他想要什么 / 缺少什么？</b> 明确目标，或尚未意识到的内在需求。</li>
        <li><b>什么打破了平衡？</b> 一次失败、一个电话、一句话。</li>
        <li><b>他如何回应？</b> 做了什么选择、为什么。</li>
        <li><b>什么迫使他改变？</b> 失败、代价、发现、他人行动。</li>
        <li><b>最后什么不一样了？</b> 事情、关系、认知或身份的变化。</li>

      {h:"一句话版", html:`<div class="coreline">原来怎样 → 发生了什么 → 我怎样回应 → 为什么不管用 → 我发现了什么 → 从此有何不同</div>`}
    ],
    exercise:"在下面用这「六个问题」把你 Day4 写过的行动故事 <b>重新梳理一遍</b>，每问一句。你会发现它其实能装下所有类型的故事。"
  },
  {
    n:12, t:"实用模板 + 首尾呼应", s:"用自然的问题填，而不是贴标签",
    core:"用「开头的我 / 事件 / 反应 / 恶化 / 最低点 / 发现 / 新选择 / 结果 / 意义 / 送给听众」串起完整故事。",
    blocks:[
      {h:"万能填写模板", html:`<div class="example">
        <b>开头·原来的我：</b>那时候，我一直认为______。<br>
        <b>事件发生：</b>直到有一天，______。<br>
        <b>第一反应：</b>我以为只要______，问题就能解决。<br>
        <b>事情恶化：</b>但是______。更糟的是______。<br>
        <b>最低点：</b>当______发生时，我意识到可能彻底失败。<br>
        <b>发现：</b>就在这时，我注意到/听到/想起______。<br>
        <b>新选择：</b>我第一次决定______。<br>
        <b>结果：</b>最后，______。<br>
        <b>意义：</b>这件事让我明白，______。<br>
        <b>送给听众：</b>所以，如果你也正在______，也许你可以______。</div>`},
      {h:"为什么这样写稳", html:`<p>它既能容纳行动故事，也能容纳认知故事；「送给听众」一句把个人经历和听众连接起来，避免「这是你的事，跟我无关」。</p>`}
    ],
    exercise:"在下面用上面的模板，<b>完整写一篇</b>你最想讲给别人的故事（150~300字）。这是你训练营里第一篇「成品」。"
  },
  {
    n:13, t:"故事诊断室（动手）", s:"你的故事到底该套哪种结构？",
    core:"先找到「这个故事最大的变化是什么」，结构自然浮现。今天用右侧工具实操。",
    blocks:[
      {h:"判断逻辑", html:`<p>讲故事前先问：<b>最大的变化是什么？</b></p>
        <ul>
          <li>事情完成了 → 行动型</li>
          <li>想法改变了 → 认知型</li>
          <li>关系改变了 → 关系型</li>

        </ul>
        <p>记住：<b>不要先拿模板找情节，先找到故事改变了什么。</b></p>`}
    ],
    exercise:"打开右侧「🩺 故事诊断室」标签，按向导回答几个问题，让它帮你判断一个你「怎么套都不顺」的真实故事属于哪类，并给出对应模板。把结论记在下面。"
  },
  {
    n:14, t:"毕业：三个判断标准", s:"主人公为什么在乎？付出什么代价？之后有何不同？",
    core:"故事讲没讲好，不看六步齐不齐，而看听众能否答出这三问。核心永远是：人在障碍前做出选择，并因此成为不同的人。",
    blocks:[
      {h:"终极三问", html:`<div class="coreline">① 主人公为什么在乎？<br>② 他为此付出了什么代价？<br>③ 经历之后，他有什么不同？</div>
        <p>这三问清楚，即使没有明显「目标—努力—成功」，依然打动人。</p>`},
      {h:"把模型收进一句话", html:`<p>原模型可升级为：<b>想要—阻碍—选择—代价—发现—改变</b>。</p>
        <p>真正的核心不是「克服障碍」，而是：<b>一个人在障碍面前做出选择，并因此成为了不同的人。</b></p>`},
      {h:"下一步", html:`<p>把 Day12 的成品故事，用这三问自检一遍。哪里答不上来，哪里就是需要补强的环节。然后——拿去讲给一个人听。</p>`}
    ],
    exercise:"在下面做你的 <b>毕业作品</b>：① 贴出 Day12 的成品故事；② 用三问逐条自检（在每问后写「✓ 已体现 / ✗ 需补强 + 怎么补」）。"
  }
];

/* ============ 诊断室数据 ============ */
const DIAG = {
  q1:{q:"这个故事里，最大的变化发生在哪一层面？", opts:[
    {k:"action", t:"事情被完成了（达成/搞砸了一个任务）", type:"行动型"},
    {k:"cog", t:"我的想法/认知被改变了", type:"认知型"},
    {k:"rel", t:"我和某个人的关系改变了", type:"关系型"},
    {k:"wit", t:"一个真相被揭示（我不是主角）", type:"见证型"},
    {k:"id", t:"我这个人（身份）改变了", type:"成长型"}
  ]},
  result:{
    action:{name:"行动型故事", tpl:"<b>困境</b> → <b>目标</b> → <b>行动</b> → <b>阻碍</b> → <b>突破</b> → <b>结果</b>",
      tip:"你最熟的结构。务必区分「外在目标」和「内在需求」，并让挫折与你的选择有因果关系。"},
    cog:{name:"认知型故事", tpl:"<b>旧认知</b> → <b>冲击</b> → <b>坚持/误判</b> → <b>代价</b> → <b>顿悟</b> → <b>新认知</b>",
      tip:"没有「考上大学」式目标很正常。主线是旧认知被新认知替代，结尾用「我以前以为…后来才明白…」收。"},
    rel:{name:"关系型故事", tpl:"<b>隔阂</b> → <b>冲突</b> → <b>误解</b> → <b>发现</b> → <b>理解</b> → <b>靠近</b>",
      tip:"别写「我的目标是获得父爱」，会很别扭。聚焦「看见对方另一面」的那个瞬间。"},
    wit:{name:"见证型故事", tpl:"<b>场景</b> → <b>异常</b> → <b>悬念</b> → <b>揭示</b> → <b>冲击</b> → <b>意义</b>",
      tip:"你不是主角，靠「正常—异常—揭示—改变」成立。重点打磨那个反常细节和最后的意义升华。"},
    id:{name:"成长型故事", tpl:"<b>原来的我</b> → <b>考验</b> → <b>逃避</b> → <b>不得不选择</b> → <b>承担</b> → <b>新的我</b>",
      tip:"核心是身份转变。把「我决定成为不同的人」那个时刻写清楚，比写成功更重要。"}
  }
};

/* ============ 状态 ============ */
const LS_DONE="camp_done_v1", LS_NOTE="camp_note_v1";
let done = JSON.parse(localStorage.getItem(LS_DONE)||"[]");
let notes = JSON.parse(localStorage.getItem(LS_NOTE)||"{}");

/* ============ 渲染 ============ */
const view=document.getElementById('view');
const nav=document.getElementById('nav');

function buildNav(){
  const items=[{k:'home',ico:'🏠',t:'训练营首页'},{k:'diag',ico:'🩺',t:'故事诊断室'},{k:'book',ico:'📓',t:'我的练习本'}];
  DAYS.forEach(d=>items.push({k:'day'+d.n,ico:'📅',t:'第'+d.n+'天'}));
  nav.innerHTML=items.map(i=>`<button data-go="${i.k}"><span class="ico">${i.ico}</span>${i.t}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function setActive(k){
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.go===k));
}
function updateBar(){
  document.getElementById('bar').style.width=(done.length/14*100)+'%';
  document.getElementById('pnum').textContent=done.length;
}

function go(k){
  setActive(k);
  if(k==='home') return renderHome();
  if(k==='diag') return renderDiag();
  if(k==='book') return renderBook();
  if(k.startsWith('day')) return renderDay(+k.slice(3));
  renderHome();
}

function renderHome(){
  const cards=DAYS.map(d=>`
    <div class="daycard ${done.includes(d.n)?'finished':''}" onclick="go('day${d.n}')">
      <div class="done">✓</div>
      <div class="dn">第 ${d.n} 天</div>
      <h3>${d.t}</h3>
      <div class="ds">${d.s}</div>
    </div>`).join('');
  view.innerHTML=`
    <div class="hero">
      <span class="tag">14 天渐进式 · 每天 10 分钟</span>
      <h1>故事演讲结构训练营</h1>
      <p>你掌握的「悲催—目标—努力—挫折—转折—结果」很好用，但它本质是一种 <b>行动型</b> 结构。当你把它套在认知、关系、见证型故事上时，就会「不顺」。这个训练营帮你先认结构、再分类型、最后随手能讲。每天学一节 + 写一段 + 打卡，进度自动保存在本机。</p>
    </div>
    <div class="sectitle">📅 课程地图</div>
    <div class="map">${cards}</div>
    <div class="footer">🦐 虾虾陪你练 · 数据仅保存在你自己的浏览器里</div>`;
  updateBar();
}

function renderDay(n){
  const d=DAYS.find(x=>x.n===n);
  const noteKey='d'+n;
  view.innerHTML=`
    <div class="lesson">
      <h2>第 ${n} 天 · ${d.t}</h2>
      <div class="sub">${d.s}</div>
      <div class="coreline">💡 今日核心：${d.core}</div>
      ${d.blocks.map(b=>`<div class="block"><h4>${b.h}</h4>${b.html}</div>`).join('')}
      <div class="exercise">
        <h4>✍️ 今日练习</h4>
        <p>${d.exercise}</p>
        <textarea id="ta" placeholder="在这里写下你的练习，自动保存…">${notes[noteKey]||''}</textarea>
        <div class="savehint" id="sh"></div>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="ck" ${done.includes(n)?'checked':''}>
        <label for="ck">我已学完今天的内容并完成练习（打卡）</label>
      </div>
      <div class="actions">
        ${n>1?`<button class="btn ghost" onclick="go('day${n-1}')">← 第${n-1}天</button>`:''}
        ${n<14?`<button class="btn primary" onclick="go('day${n+1}')">第${n+1}天 →</button>`:`<button class="btn primary" onclick="go('home')">回到首页 🎉</button>`}
        <button class="btn ghost" onclick="go('book')">📓 我的练习本</button>
      </div>
    </div>`;
  const ta=document.getElementById('ta'), sh=document.getElementById('sh'), ck=document.getElementById('ck');
  let timer;
  ta.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{
    notes[noteKey]=ta.value;localStorage.setItem(LS_NOTE,JSON.stringify(notes));
    sh.textContent='✓ 已自动保存';setTimeout(()=>sh.textContent='',1500);
  },500)};
  ck.onchange=()=>{
    if(ck.checked && !done.includes(n)){done.push(n);}
    if(!ck.checked){done=done.filter(x=>x!==n);}
    localStorage.setItem(LS_DONE,JSON.stringify(done));
    updateBar();
    if(ck.checked) sh.textContent='🎉 第'+n+'天打卡成功！';
  };
}

function renderDiag(){
  view.innerHTML=`
    <div class="wizard">
      <h2 style="margin-bottom:6px">🩺 故事诊断室</h2>
      <div class="sub">回答下面 1 个问题，立刻知道你的故事该套哪种结构，并拿到对应模板。</div>
      <div class="wstep">
        <div class="q">${DIAG.q1.q}</div>
        ${DIAG.q1.opts.map(o=>`<div class="opt" data-k="${o.k}">${o.t}</div>`).join('')}
      </div>
      <div class="result" id="res"></div>
      <div class="note">💡 提示：判断不出就选「最让你心里一动」的那个变化。结构是为了服务故事，不是反过来。</div>
    </div>`;
  const res=document.getElementById('res');
  view.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    view.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
    const r=DIAG.result[o.dataset.k];
    res.innerHTML=`<h3>✅ 你的故事属于：${r.name}</h3>
      <div class="tpl">${r.tpl}</div>
      <p style="color:#4a5a58;font-size:14px">${r.tip}</p>
      <p style="font-size:13px;color:#7a8a88">现在去「第${o.dataset.k==='id'?'14':({action:4,cog:5,rel:6,wit:7})[o.dataset.k]}天」用这个模板写一遍，或直接在 📓 练习本里练。</p>`;
    res.classList.add('show');
  });
}

function renderBook(){
  const entries=DAYS.filter(d=>notes['d'+d.n]).map(d=>`
    <div class="block">
      <h4>第 ${d.n} 天 · ${d.t}</h4>
      <p style="white-space:pre-wrap;font-size:14px">${notes['d'+d.n].replace(/</g,'&lt;')}</p>
    </div>`).join('');
  view.innerHTML=`
    <h2 style="margin-bottom:6px">📓 我的练习本</h2>
    <div class="sub">这里汇总了你所有天的练习笔记（仅存于本机）。</div>
    ${entries||'<div class="note">还没有任何练习记录。去「课程地图」选一天开始写吧。</div>'}
    <div class="actions"><button class="btn ghost" onclick="go('home')">← 返回首页</button></div>`;
}

buildNav();
go('home');
</script>
</body>
</html>
