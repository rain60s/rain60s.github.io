<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI口才训练营 · 开口计划</title>
<style>
  :root{
    --bg:#fbf7f0;
    --card:#ffffff;
    --ink:#2f2a26;
    --muted:#8a8178;
    --line:#ece3d6;
    --shadow:0 6px 22px rgba(120,90,50,.10);
    --theme:#e8943a; --theme-soft:#fbe9d2; --theme-deep:#b96f1c;
    --lv-gold:#d9a441; --lv-orange:#e07840; --lv-blue:#5a83c4; --lv-red:#c94f4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:17px}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:430px;margin:0 auto;min-height:100vh;padding:0 16px 60px}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);
    display:flex;align-items:center;gap:10px;
    padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .topbar .tbtn{
    border:1px solid var(--line);background:#fff;border-radius:12px;
    font-size:15px;font-weight:700;color:var(--ink);padding:8px 14px;cursor:pointer;font-family:inherit;
  }
  .topbar .tt{flex:1;text-align:center;font-size:18px;font-weight:800}
  .topbar .switch{color:var(--theme-deep);border-color:var(--theme)}

  /* ===== 首页选营 ===== */
  .hero{text-align:center;padding:26px 10px 6px}
  .hero h1{font-size:24px;line-height:1.4}
  .hero p{color:var(--muted);font-size:15px;margin-top:6px}
  .groupt{font-size:17px;font-weight:800;margin:24px 2px 4px;color:#5f574e}
  .campcard{
    display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
    background:var(--card);border:2px solid var(--line);border-radius:20px;
    padding:20px;margin-top:12px;box-shadow:var(--shadow);transition:.15s;
  }
  .campcard:active{transform:scale(.98)}
  .campcard .cname{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
  .campcard .cico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .campcard .cdesc{color:var(--muted);font-size:14px;margin-top:8px}
  .campcard .cprog{margin-top:12px}
  .bar{height:12px;background:#f0e9de;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;transition:.4s}
  .campcard .pnum{font-size:14.5px;font-weight:700;margin-top:8px}

  /* ===== 区块通用 ===== */
  .sect{font-size:19px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}

  /* ===== 星图 ===== */
  .starmap{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .star{
    aspect-ratio:1/1.15;border-radius:12px;border:2px solid var(--line);background:#faf6ee;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-family:inherit;cursor:default;position:relative;transition:.15s;
  }
  .star .dn{font-size:15px;font-weight:800;color:var(--muted)}
  .star .ds{font-size:13px;line-height:1}
  .star.done{background:var(--theme);border-color:var(--theme);cursor:pointer}
  .star.done .dn,.star.done .ds{color:#fff}
  .star.today{background:var(--theme-soft);border-color:var(--theme);cursor:pointer;animation:pulse 1.6s infinite}
  .star.today .dn{color:var(--theme-deep)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 5px var(--theme-soft)}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--muted)}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px}

  /* ===== 勋章 ===== */
  .badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .badge{
    border-radius:14px;padding:12px 4px;text-align:center;
    background:#faf6ee;border:2px solid var(--line);
  }
  .badge .bi{font-size:24px;line-height:1;filter:grayscale(1);opacity:.4}
  .badge .bn{font-size:12px;font-weight:700;margin-top:6px;color:var(--muted);line-height:1.3}
  .badge .bc{font-size:11px;color:#b8afa2;margin-top:2px}
  .badge.on{background:#fff}
  .badge.on .bi{filter:none;opacity:1}
  .badge.on .bn{color:var(--ink)}
  .badge.on.l1,.badge.on.l2{border-color:var(--lv-gold);box-shadow:0 3px 12px rgba(217,164,65,.25)}
  .badge.on.l3{border-color:var(--lv-orange);box-shadow:0 3px 12px rgba(224,120,64,.25)}
  .badge.on.l4{border-color:var(--lv-blue);box-shadow:0 3px 12px rgba(90,131,196,.25)}
  .badge.on.l5{border-color:var(--lv-red);box-shadow:0 3px 12px rgba(201,79,79,.3)}

  /* ===== 四项指标 ===== */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .stat .sv{font-size:26px;font-weight:800;color:var(--theme-deep)}
  .stat .sl{font-size:14px;color:var(--muted);margin-top:2px}

  /* ===== 打卡面板 ===== */
  .checkin{background:linear-gradient(135deg,#fff,var(--theme-soft));border:2px solid var(--theme);border-radius:18px;padding:20px}
  .checkin .daytag{display:inline-block;background:var(--theme);color:#fff;font-size:13.5px;font-weight:700;padding:3px 12px;border-radius:99px}
  .checkin h3{font-size:19px;margin:12px 0 4px;line-height:1.45}
  .checkin .ctip{font-size:14.5px;color:#5f574e;margin-top:10px}
  .rate-row{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .rate{
    border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;
    font-size:16.5px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;color:var(--ink);
  }
  .rate.sel{border-color:var(--theme);background:var(--theme-soft);color:var(--theme-deep)}
  .bigbtn{
    width:100%;border:none;border-radius:16px;background:var(--theme);color:#fff;
    font-size:18px;font-weight:800;font-family:inherit;padding:16px;cursor:pointer;margin-top:14px;
  }
  .bigbtn:disabled{background:#cfc7ba;cursor:not-allowed}
  .ghostbtn{
    width:100%;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
    font-size:15px;font-weight:700;font-family:inherit;padding:12px;cursor:pointer;margin-top:10px;
  }

  /* ===== 每日课程内容 ===== */
  .lesson{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:6px}
  .lesson .lh{font-size:15px;font-weight:800;color:var(--theme-deep);margin:14px 0 8px}
  .chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chain .cp{background:#fff;border:1.5px solid var(--theme);color:var(--theme-deep);font-size:13.5px;font-weight:700;padding:4px 10px;border-radius:99px}
  .chain .ca{color:var(--muted);font-size:13px}
  .demo{background:#fff;border:1px solid var(--line);border-left:4px solid var(--theme);border-radius:0 12px 12px 0;padding:14px 16px;font-size:15px;color:#463f37}
  .demo .dt{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .demo.pending{border-left-color:#cfc7ba;color:#8a8178;background:#faf6ee}
  .tiplist{font-size:14px;color:#5f574e;margin-top:4px;padding-left:2px;list-style:none}
  .tiplist li{margin-bottom:6px;padding-left:20px;position:relative}
  .tiplist li::before{content:"▸";position:absolute;left:2px;color:var(--theme)}

  /* ===== 数据管理 ===== */
  .datamsg{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:center;min-height:20px}
  .footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}
  .hidden{display:none !important}

  /* ===== 弹层 ===== */
  .mask{position:fixed;inset:0;background:rgba(47,42,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:430px;max-height:82vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 20px 34px;animation:up .25s}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sheet h3{font-size:19px;line-height:1.45}
  .sheet .meta{font-size:14px;color:var(--muted);margin-top:6px}
  .sheet .body{margin-top:14px;font-size:15.5px}
  .sheet .gl{font-size:14px;font-weight:800;color:var(--muted);margin:14px 0 2px}
</style>
</head>

<script>
/* ================= 全部营地数据（由知识库课程笔记生成） ================= */
const CAMPS = {"adult": {"name": "成人训练营 · 一期", "ico": "🎤", "theme": {"c": "#e8943a", "soft": "#fbe9d2", "deep": "#b96f1c"}, "desc": "即兴演讲 10 个表达框架压进 21 天：PREP、黄金三点、结论先行……每天 30 秒开口，练出结构感。", "days": [{"t": "PREP 观点表达法：坚持比天赋更重要", "k": "新框架", "chain": "P观点—R理由—E例子—P重申", "demo": "我认为，坚持往往比天赋更重要。因为一个人即使很有天赋，如果不愿意付出努力，也很难取得真正的成绩；相反，普通人只要愿意每天进步一点，坚持足够长的时间，也能做出不普通的结果。比如我刚开始学习演讲时，一上台就紧张，甚至会忘词。但是我每天坚持朗读、录音和复盘，慢慢地不仅敢上台了，表达也越来越清晰。所以我相信，天赋决定起点，而坚持决定我们最终能够走多远。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "黄金三点法：如何提高工作效率", "k": "新框架", "chain": "开门见山—第一点—第二点—第三点—总结", "demo": "关于如何提高工作效率，我有三点建议。第一，要明确目标。每天开始工作前，先确定最重要的三件事，避免把时间花在不重要的事情上。第二，要合理安排时间。把复杂任务拆成小步骤，并为每一步设置完成节点。第三，要及时复盘。每天工作结束后，总结哪些事情做得好，哪些环节还可以优化。总的来说，提高效率不是让自己一直忙，而是把正确的事情，用正确的方法做好。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "过去—现在—未来：我的成长变化", "k": "新框架", "chain": "过去状态—现在行动—已经变化—未来目标", "demo": "过去的我不太敢在人多的场合发言，每次老师或领导点到我，我都会紧张，不知道应该从哪里说起。现在，我开始有意识地练习表达，会提前整理思路，也会通过录音发现问题。经过一段时间训练，我已经能够更加自信地表达观点。未来，我希望继续提升表达能力，不仅把话说清楚，还能够通过表达影响和帮助更多人。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "现象—原因—解决方案：为什么不敢上台", "k": "新框架", "chain": "描述现象—分析原因—给出方案—总结判断", "demo": "现在有一个很常见的现象：很多人在台下很会聊天，但一旦站到台上，就会紧张、忘词，甚至不敢看观众。出现这个问题，主要有两个原因：第一，平时缺少公开表达机会；第二，太在意别人的评价，担心自己说错。要解决这个问题，可以从小场景开始练习，先对着镜子说，再录制视频，然后在熟悉的人面前表达。通过一次次练习逐步建立自信。上台不紧张不是天生能力，而是可以训练的能力。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "是什么—为什么—怎么做：高情商表达", "k": "新框架", "chain": "解释概念—说明价值—给出方法—升华总结", "demo": "什么是高情商表达？它并不是一味讨好别人，而是在表达自己观点的同时，也照顾对方的感受。为什么要学习？因为同样一句话，换一种方式说，可能产生完全不同的结果。具体怎么做？第一，先听完对方的话；第二，先表达理解，再说自己的观点；第三，多用商量语气，少用命令和指责。高情商不是不说真话，而是用对方更容易接受的方式说真话。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "问题—行动—结果：完成一次紧急任务", "k": "新框架", "chain": "交代问题—拆解行动—呈现结果—总结经验", "demo": "有一次，领导临时交给我一项重要任务，要求当天完成。由于时间紧、资料多，我开始非常有压力。为了按时完成，我先把任务拆成三个部分，按照重要程度安排顺序；随后主动联系相关同事，快速补齐缺失信息，并定时检查进度。最终，我不仅按时完成任务，还提前发现并修改了两个数据错误。这次经历让我明白，面对紧急任务，抱怨没有用，快速理清思路并立即行动才是关键。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "复盘日：本周 6 个框架随机抽题 + 教练集中点评", "k": "复盘", "tip": ["从本周 6 个框架（PREP／黄金三点／过去现在未来／现象原因／是什么为什么怎么做／问题行动结果）里随机抽一个", "准备 1 分钟，开口讲 2 分钟", "把卡壳的地方记下来，回到对应那天再练一次"]}, {"t": "故事表达法：一次失败带来的启发（六步）", "k": "新框架", "chain": "背景—冲突—失败—复盘—改变—启发", "demo": "记得有一次，我参加演讲比赛。比赛前准备了很长时间，也背熟了整篇演讲稿。可是上台后，因为太紧张，我突然忘记后面的内容，大脑一片空白，最后没有取得理想成绩。比赛结束后，我认真复盘，发现自己只会背稿，却没有真正掌握表达逻辑。后来我开始练习用框架讲话，而不是逐字背讲。下一次比赛即使忘记一句话，我依然能够顺利讲下去。这件事让我明白，失败不可怕，它只是提醒我们换一种方法继续前进。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "感谢—回顾—展望：获奖感言", "k": "新框架", "chain": "表达感谢—回顾过程—说明收获—展望未来", "demo": "首先，我要感谢老师的指导，也感谢同学们一直以来的鼓励和支持。今天能够获得这个奖项，对我来说既是一份荣誉，也是一份新的责任。回顾这段经历，我也遇到过困难，甚至有想放弃的时候，但在大家帮助下坚持了下来，并在一次次练习中不断成长。未来，我会把这次获奖当成新的起点，继续努力提升自己，也希望有机会帮助更多人。谢谢大家，这份荣誉属于每一位支持和帮助过我的人。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "认可—分析—建议：向领导提出不同意见", "k": "新框架", "chain": "先认可价值—分析现实限制—提出可行建议—说明收益", "demo": "领导，我非常认可您提出的方案，这个方案在提升团队执行速度方面确实有明显优势。不过结合目前实际情况，我们的人员和时间都比较有限，如果一次性全面推进，可能出现任务过多、质量难以保证的问题。我的建议是先选择一个部门试点，用一周验证效果。试点完成后，再根据数据和反馈调整，随后逐步推广。这样既能控制风险，也能保证最终执行效果。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "结论先行法：项目能否按时完成", "k": "新框架", "chain": "先给结论—列出依据—说明计划—再次确认", "demo": "我的结论是，这个项目可以按时完成，但需要对目前的工作安排进行调整。主要有三个依据：第一，核心内容已经完成百分之七十；第二，剩余任务的难点已经找到解决方案；第三，相关同事也确认可以配合。接下来我会重新安排任务优先级，今天完成核心功能，明天进行整体测试，后天完成最终修改和交付。只要按照新的计划执行，项目就能够在规定时间内完成。", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成自己的真实主题再说一遍", "第三轮：只看结构卡和关键词，不看稿"]}, {"t": "组合练 1：PREP + 黄金三点（观点 + 要点）", "k": "组合", "chain": "一句话亮观点—三点展开—总结重申", "tip": ["选一个工作里的真实话题", "先用 PREP 一句话亮明观点", "再用黄金三点法展开，结尾回到观点"]}, {"t": "组合练 2：现象原因 + 认可建议（分析 + 建言）", "k": "组合", "chain": "描述现象—分析原因—先认可—再给建议", "tip": ["选一个你想提建议的真实场景", "先用现象—原因把问题说清楚", "再用认可—分析—建议的方式提出来"]}, {"t": "复盘日：本周框架随机抽题 + 教练集中点评", "k": "复盘", "tip": ["从本周学的内容（故事六步／感谢回顾展望／认可分析建议／结论先行／两个组合练）里随机抽一题", "准备 1 分钟，开口讲 2 分钟", "把卡壳的地方记下来，回到对应那天再练一次"]}, {"t": "组合练 3：问题行动结果 + 结论先行（汇报线）", "k": "组合", "chain": "先给结论—交代问题—拆解行动—呈现结果", "tip": ["选一件你做过的工作任务", "第一句话先给结论（做成了什么）", "再用问题—行动—结果讲清经过"]}, {"t": "组合练 4：故事表达 + 感谢回顾展望（致辞线）", "k": "组合", "chain": "表达感谢—六步故事—回顾收获—展望未来", "tip": ["设想一个要致辞的场合（获奖／毕业／答谢）", "开场先感谢", "中间用故事六步讲一段真实经历，结尾展望"]}, {"t": "即兴抽题日：10 个框架随机抽 1，准备 1 分钟开口", "k": "实战", "tip": ["从 10 个框架中随机抽 1 个", "只准备 1 分钟", "不看稿，开口讲 2 分钟"]}, {"t": "毕业稿选题 + 列框架", "k": "毕业", "tip": ["选一个你真正想讲的主题（工作、成长、经历都可以）", "定下用哪个框架来讲", "按结构卡写出每格关键词，每格不超过 8 个字"]}, {"t": "毕业稿初稿（录音）", "k": "毕业", "tip": ["按昨天列的关键词，完整讲一遍并录音（2—3 分钟）", "讲完先不回听，直接打卡", "明天再回听打磨"]}, {"t": "毕业稿打磨（教练一对一或小组互评）", "k": "毕业", "tip": ["回听昨天的录音，记下 2 个要改的点", "删掉重复的话，补一个真实细节", "再录一遍，对比两遍哪遍更好"]}, {"t": "毕业表达 + 颁章", "k": "毕业", "tip": ["不看稿，完成你的毕业表达（2—3 分钟）", "讲完为自己点亮毕业勋章 🏆", "可把录音发到训练营群里，参加结营仪式"]}]}, "kids": {"name": "少儿训练营 · 一期", "ico": "🌱", "theme": {"c": "#3a8e8a", "soft": "#d8efed", "deep": "#256a67"}, "desc": "从少儿口才 60 节精选 21 节，7 个模块能力递进：从完整说话到主持、采访、故事创编。", "days": [{"t": "完整自我介绍：让别人完整认识自己", "k": "基础表达", "chain": "问好—姓名年龄—兴趣爱好—一个优点—一个梦想—感谢", "demo": "大家好，我叫林一诺，今年九岁，在三年级二班学习。我喜欢画画和跳绳，画画让我能把脑海里的奇思妙想记录下来，跳绳让我变得更有耐心。我的优点是做事认真，答应别人的事情会努力完成。我的梦想是成为一名设计师，设计出既漂亮又实用的东西。很高兴认识大家，希望以后能和大家互相帮助、共同进步，谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "声音、表情和站姿：上台五件事", "k": "基础表达", "chain": "站稳—微笑—看听众—清楚说话—自然收尾", "demo": "大家好，今天我来分享一本喜欢的书。上台后，我先把双脚自然站稳，抬起头看向大家，再带着微笑开始说话。我会把声音送到教室最后一排，重要的地方说慢一点，句子说完停一下。手势不需要很多，只在介绍精彩情节时自然打开双手。最后，我看着大家说：“这就是我的分享，谢谢大家！”练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "怎样把一句话说完整", "k": "基础表达", "chain": "是什么—为什么—我的感受", "demo": "妈妈问我：“今天的科学课有趣吗？”我没有只回答“有趣”，而是说：“今天的科学课特别有趣，因为老师带我们做了一个彩虹实验。我看到不同颜色在杯子里慢慢分开，觉得非常神奇。回家后，我还想用安全的材料再试一次。”这样回答既说清了结果，也说明了原因和自己的感受。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "怎样把一件事讲清楚（叙事六要素）", "k": "基础表达", "chain": "时间—地点—人物—经过—结果—感受", "demo": "今天下午第二节体育课，我们在操场上练习接力跑。轮到我交棒时，因为跑得太急，接力棒掉在了地上。我马上捡起来继续跑，同组同学也一直为我加油。虽然我们没有得第一名，但大家没有责怪我。下课后，我又练了几次交棒动作，明白了配合比一味追求速度更重要。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "怎样按照顺序表达", "k": "基础表达", "chain": "一开始—接着—然后—最后", "demo": "今天我自己整理了书包。首先，我把书包里的课本和练习本全部拿出来，按照课程表分成几类。接着，我把明天要用的书一本一本装进去。然后，我检查文具盒里的铅笔、橡皮和尺子是否齐全。最后，我把水杯放进侧袋，再看一遍课程表。这样整理后，第二天就不会手忙脚乱了。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "怎样让表达更生动", "k": "基础表达", "chain": "看见什么—怎样动作—说了什么—我有什么感受", "demo": "放学时，天空突然下起了大雨。豆大的雨点敲在雨伞上，发出“啪嗒啪嗒”的声音。我看见同桌站在教学楼门口，着急地望着天空，就跑过去说：“我们一起走吧！”他先愣了一下，随后开心地笑了。我们挤在一把伞下，小心地绕过水坑，心里觉得暖暖的。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "复盘日：本周 6 节随机抽题，跟家人讲一遍", "k": "复盘", "tip": ["从本周 6 节课里挑一节，跟家人完整讲一遍", "请家人说说：哪里听得最清楚、哪里没听明白", "把没讲好的那节再练一遍"]}, {"t": "看图说话：春天的公园", "k": "看图说话", "chain": "季节—地点—人物—景物—心情", "demo": "一个阳光明媚的周末，爸爸妈妈带着小女孩来到公园。草地像铺上了绿色地毯，粉色和黄色的小花在风中轻轻摇摆。小女孩举着风筝向前奔跑，爸爸在后面帮她放线。湖边有人散步，树枝上的小鸟叽叽喳喳地唱歌。看到这么美的春景，小女孩开心地说：“春天真的回来了！”练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "看图说话：公交车上让座", "k": "看图说话", "chain": "看见问题—人物动作—礼貌对话—感受", "demo": "周末，明明和妈妈乘公交车去图书馆。车到下一站时，一位拄着拐杖的爷爷慢慢走上来，车里已经没有空位。明明马上站起来说：“爷爷，您坐我这里吧，我站着就可以。”爷爷微笑着向他道谢。明明扶爷爷坐稳后，抓好扶手站在妈妈身边。妈妈没有说话，只向他竖起了大拇指。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "看图说话：第一次上台表演", "k": "看图说话", "chain": "上台前—表演中—结束后—心情变化", "demo": "演出开始前，我站在后台，手心不停出汗，心里像住着一只乱跳的小兔子。老师拍拍我的肩说：“先深呼吸，你已经准备得很充分了。”轮到我上台时，我看着前方，先向大家鞠躬，再跟着音乐完成动作。中间虽然有一个动作慢了半拍，我没有停下来。表演结束后，台下响起掌声，我发现勇敢不是不紧张，而是紧张时仍愿意完成。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "故事表达：一次让我特别开心的经历", "k": "故事表达", "chain": "发生什么—为什么开心—最难忘细节—我的感受", "demo": "去年暑假，我终于学会了游泳。刚开始，我只敢扶着池边练习，脸一碰到水就很紧张。教练教我先吹气，再伸直身体向前滑。经过很多次练习，我第一次独立游到对岸时，爸爸在岸边为我鼓掌。那一刻我特别开心，不仅是因为学会了游泳，还因为我战胜了自己的害怕。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "故事表达：一次我没有放弃的经历", "k": "故事表达", "chain": "遇到困难—尝试方法—得到帮助—变化—收获", "demo": "为了参加学校跳绳比赛，我每天放学后练习十分钟。最开始，我连续跳不到二十个，绳子总打到脚。我请体育老师帮我观察，发现自己手臂摆动太大。调整动作后，我把目标分成三十个、五十个和一百个。比赛那天，我顺利完成了挑战。坚持不是一直重复，而是发现问题后继续改进。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "故事表达：三个关键词编故事", "k": "故事表达", "chain": "人物—地点—目标—困难—办法—结果", "demo": "我抽到的关键词是“小熊、雨伞、云朵城堡”。小熊背着书包去上学，突然发现一把会飞的雨伞。雨伞带它来到云朵城堡，可城堡的大门被风吹坏了。小熊用书包里的绳子和尺子帮助大家修好大门。云朵国王为了感谢它，让雨伞把它安全送回学校。小熊明白，知识在关键时刻真的能解决问题。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "复盘日：看图 + 故事随机抽题，完整讲一遍", "k": "复盘", "tip": ["从本周的看图说话和故事表达里抽一题", "按结构卡的顺序完整讲一遍", "回听一遍，检查有没有漏掉顺序词"]}, {"t": "生活表达：分享学校里的一件事", "k": "生活表达", "chain": "发生什么—和谁有关—我怎么做—结果—感受", "demo": "今天学校发生了一件让我感动的事。午休时，一位同学不小心把水洒在地上，正着急地找工具。附近几名同学没有嘲笑他，而是有人拿拖把，有人放提示牌，还有人帮他擦桌子。很快，地面恢复了干净。老师表扬了大家的合作。我觉得一个温暖的班级，就是遇到问题时一起解决，而不是互相责怪。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "校园实战：课堂上回答问题", "k": "校园实战", "chain": "我的答案—判断理由—课文或生活证据—小结", "demo": "老师，我认为故事里的小主人公最后会选择道歉。因为前文写到他发现朋友很难过，而且他一直想把事情补救好。生活中，如果我们无意中给别人造成麻烦，主动承认比找借口更能解决问题。所以我的判断是，他会先说明事实，再真诚道歉，并想办法弥补自己的错误。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "礼貌沟通：感谢和赞美别人", "k": "礼貌沟通", "chain": "具体行为—给我的帮助—真实感受—感谢", "demo": "小雨，谢谢你今天在我忘记带彩笔时主动借给我。你不但把颜色分给我，还提醒我怎样搭配更好看，所以我才能按时完成作品。我特别喜欢你愿意帮助别人、说话又很耐心的样子。下次你需要工具或遇到困难，也可以来找我。我会爱护彩笔，现在把它们完整地还给你。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "毕业展示选题：从采访 / 主持 / 创编中选一项", "k": "毕业", "tip": ["从小记者采访 / 小主持人 / 故事创编里选一项，作为毕业展示", "写下 5 个准备用的关键词", "跟家人说说你选了什么、为什么选它"]}, {"t": "趣味角色挑战：故事大王创编挑战（初稿）", "k": "毕业", "chain": "人物地点—目标—意外困难—解决办法—完整结尾", "demo": "我抽到的人物是“小狐狸”，地点是“太空站”，任务是“寻找丢失的种子”。小狐狸乘飞船来到太空站，发现装种子的盒子被风吹进了维修通道。通道里没有灯，它先害怕了一会儿，然后用手表灯照路，并请机器人一起寻找。最后，它们在通风口找到了种子。种子被种进太空花园，小狐狸也明白了遇到困难要冷静合作。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "趣味角色挑战：小主持人现场挑战（打磨）", "k": "毕业", "chain": "欢迎开场—介绍流程—自然串联—处理小意外—总结感谢", "demo": "各位家长、亲爱的小朋友们，大家下午好！欢迎参加今天的家庭故事会。我是小主持人果果。首先，请大家把掌声送给第一位讲故事的小朋友；接下来是有趣的猜谜环节，请大家举手回答。刚才话筒出现了一点小问题，请大家稍等，我们马上继续。快乐的时间总是很短，感谢每一位表演者和听众，今天的故事会圆满结束！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}, {"t": "少儿趣味口才综合展示 + 颁章", "k": "毕业", "chain": "选择任务—准备关键词—完整展示—回听—自我检查", "demo": "大家好，今天我带来的主题是“勇敢不是不害怕”。第一次独自参加夏令营时，我很担心交不到朋友。到达后，我先主动向同组伙伴介绍自己，又在搭帐篷时提出帮忙。虽然第一晚还是有点想家，但我学会了整理物品，也认识了新朋友。这段经历让我明白，害怕很正常，只要愿意迈出第一步，我们就会发现自己比想象中更勇敢。谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"]}]}, "kids2": {"name": "少儿训练营 · 进阶", "ico": "🌿", "theme": {"c": "#7a9a3a", "soft": "#e9f0d8", "deep": "#5a7526"}, "desc": "少儿口才 60 节中一期未用的 42 节全收：看图说话 15 节、故事 5 节、生活 7 节、校园 9 节、礼貌 5 节、采访 1 节。", "days": [{"t": "雨天共用一把伞", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "起因—帮助动作—人物语言—结果", "demo": "放学时突然下起大雨，小雨撑开自己的蓝色雨伞，发现同学乐乐没有带伞。她走过去说：“乐乐，我们顺路，一起走吧。”两个人把书包背好，紧紧挨在一把伞下。路上，小雨把伞往乐乐那边移，自己的肩膀却淋湿了一点。乐乐感动地说：“谢谢你，明天我带毛巾给你。”雨虽然很大，他们心里却很温暖。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "快乐的大扫除", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "整体场面—有的—有的—还有的—结果", "demo": "星期五下午，我们班进行大扫除。老师先分好任务，有的同学扫地，有的同学擦黑板，还有的同学整理图书角。我和小伙伴负责擦窗台，我们先用水湿布擦掉灰尘，再用干布把水印擦干净。大家一边劳动一边互相提醒，不一会儿，教室就变得整洁明亮。看着自己的劳动成果，我们都很有成就感。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "小猫找不到家", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "发现—推测—安慰—**求助**—温暖结尾", "demo": "回家路上，我在花坛旁边听见微弱的叫声，原来是一只小猫缩在纸箱后面。它的毛有点湿，身体还在发抖。我没有马上抱它，而是蹲下来轻声说：“别害怕，我来帮你。”我请附近的保安叔叔一起查看，又在小区群里发布了寻找主人的消息。过了一会儿，小猫的主人赶来把它接回家，我终于放心了。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第一次学骑自行车", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "困难—练习—帮助—变化—学会", "demo": "第一次学骑自行车时，我刚坐上车就紧张得紧紧握住车把。爸爸在后面扶着车座，提醒我看前方、慢慢蹬。我试了几次还是摔倒了，膝盖有一点疼，差点想放弃。休息后，我重新调整车把，先练平衡，再练转弯。练到傍晚时，我终于能独立骑出一小段。那一刻我明白，学会新本领需要勇气和耐心。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "温暖的生日惊喜", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "发现惊喜—表情动作—人物对话—感受", "demo": "生日那天，我像平常一样推开门，屋里却黑黑的。我刚放下书包，灯突然亮了，爸爸妈妈和朋友们一起喊：“生日快乐！”桌上放着蛋糕，墙上挂着彩色气球，还有大家亲手写的祝福卡。我惊喜得不知道先说什么，只能不停地笑。我认真感谢每一个人，也许愿以后能把同样的温暖带给别人。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "热闹的运动会", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "时间地点—比赛动作—观众声音—现场心情", "demo": "星期三上午，学校操场上正在举行运动会。跑道上的运动员弯下身体，听到发令声后像箭一样冲了出去。看台上的同学挥着彩旗，大声喊着：“加油！坚持住！”跳远区、投掷区也在紧张比赛。虽然太阳很晒，大家仍然热情十足。比赛结束后，不论名次怎样，同学们都为勇敢参赛的人鼓掌。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "商场里迷路了", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "停在安全处—说明问题—提供信息—等待家人", "demo": "我在商场看玩具时，一转身发现妈妈不见了。刚开始我很着急，但想起妈妈教过我的办法，就没有到处乱跑。我站到服务台附近，找到穿制服的工作人员说：“阿姨，我和妈妈走散了，我叫乐乐，妈妈穿白色外套。”工作人员通过广播帮我寻找。几分钟后妈妈赶来了，我告诉自己以后一定要紧跟家人。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "厨房里的小帮手", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "首先—接着—然后—最后—劳动感受", "demo": "晚饭前，我主动到厨房帮奶奶准备食材。首先，我把青菜一片片摘好，放进盆里清洗。接着，我把洗好的西红柿递给奶奶切块。然后，我拿出碗筷，按照家里人数摆到餐桌上。做饭时我不碰刀具和热锅，只完成安全的小任务。大家吃饭时夸我是小帮手，我觉得劳动特别有意义。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "一起保护环境", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "看到现象—采取行动—说明意义—我的计划", "demo": "星期天，我们在公园散步时，看见草地上有几个饮料瓶和食品袋。我和同伴戴好手套，把垃圾捡起来，再按照可回收物和其他垃圾分类投放。我们还礼貌提醒游客不要把垃圾留在草地上。公园是大家共同休息的地方，保护环境不能只靠清洁工。回家后，我决定从自带水杯、少用一次性用品开始。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "受伤的小鸟", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "发现问题—**保护现场**—正确求助—结果", "demo": "我在小区树下发现一只小鸟趴在地上，它的一只翅膀好像受伤了。我没有用手随意抓它，也没有围着它大声说话，而是请其他小朋友先离远一点。我马上告诉爸爸，并联系了附近的动物救助人员。我们在旁边安静等待，防止小猫靠近。救助人员把小鸟带走治疗，我希望它康复后能重新飞回天空。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "排队的小朋友", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "观察行为—说明规则—解释原因—文明提醒", "demo": "午餐时间，同学们拿着餐盘在食堂门口排队。大家按照先后顺序慢慢向前，没有推挤。一个小朋友着急地想插到前面，旁边的同学轻声说：“大家都在等，我们一起排队会更安全，也更公平。”小朋友听后回到了队尾。很快，每个人都拿到了午餐。遵守秩序看起来是小事，却能让很多人更加方便。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "图书馆里的一天", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "环境—人物活动—规则—推荐一本书", "demo": "周六上午，我来到图书馆。大厅里很安静，大家都轻轻翻书、低声交流。我先在少儿区找到一本关于宇宙的书，读完后把它放回原来的位置。借书时，我按顺序排队，并向管理员阿姨说谢谢。离开前，我还帮忙把椅子推回桌下。我最想推荐《神奇的星空》，因为它让我认识了许多星球。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "爷爷的生日礼物", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "准备材料—制作过程—送出礼物—双方感受", "demo": "爷爷生日快到了，我决定亲手做一张贺卡。首先，我准备了彩纸、画笔和安全剪刀。接着，我在封面画了一棵大树，因为爷爷一直像大树一样保护我。然后，我在里面写下：“谢谢您每天接我放学，祝您健康快乐。”生日那天，爷爷收到贺卡后笑得特别开心。我发现用心制作的礼物比价格更重要。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "未来的学校", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "未来会有—学生可以—我最喜欢—我还希望", "demo": "我想象中的未来学校建在一座绿色花园里。校门口机器人帮助同学寻找教室，黑板能把抽象知识变成立体画面。教室的桌椅可以根据身高自动调整，屋顶还能收集太阳能。学生不仅学习课本，还能进入虚拟实验室探索海底和太空。我最希望学校保留真实的操场和朋友间的交流，因为科技再方便，也不能代替一起成长的快乐。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "神奇的海底城市", "k": "看图说话", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "环境—交通—学习生活—特别规则—想象感受", "demo": "在我想象的海底城市里，房屋像透明的大泡泡，窗外能看见五颜六色的鱼群。人们乘坐海龟形状的海洋公交上学，机器人负责清理海底垃圾。学校里有珊瑚教室，老师带大家研究海洋生物。这里规定不能伤害动物，也不能随意丢弃塑料。我想住进这座城市，因为它既神奇，又懂得保护大海。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "一次让我紧张的经历", "k": "故事表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "紧张前—紧张时—我怎么做—结束后的变化", "demo": "第一次参加朗诵比赛时，我在候场区紧张得一直看稿子。听到自己的名字后，我先做了三次深呼吸，提醒自己把第一句话说稳。上台后，我看到老师鼓励的眼神，慢慢找回了节奏。虽然有一个词停顿了一下，但我没有慌张。比赛结束后，我发现充分准备和勇敢开始，能让紧张一点点变小。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "我 → 别人", "k": "故事表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "困难—**看见**—**行动**—**对方反应**—我的感受", "demo": "课间，我发现新同学站在走廊里，不知道音乐教室在哪里。我走过去问：“你是不是在找教室？我可以带你去。”路上，我告诉他下次可以先看楼层指示牌。到达后，他笑着向我道谢。后来我们还成为了朋友。这件事让我明白，帮助别人有时只需要多观察一步、主动问一句。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "别人 → 我", "k": "故事表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "我的困难**—**对方行动**—**事情结果**—具体感谢", "demo": "有一次数学作业中，我被一道应用题难住了，想了很久都没有头绪。同桌没有直接告诉我答案，而是画了一张线段图，提醒我先找出已知条件。我顺着他的提示终于算出来了。下课后，我认真对他说：“谢谢你教我方法，而不是只给答案。”他的帮助让我学会了怎样自己解决类似问题。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "听故事再复述", "k": "故事表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "主人公—目标—问题—解决—明白的道理", "demo": "故事的主人公是一只想过河的小刺猬。它先找来树枝搭桥，可树枝太短；又想踩石头过去，却差点滑倒。后来，小刺猬请河狸帮忙，两个人一起把木板固定好，终于安全过河。过河后，小刺猬主动帮助河狸搬食物。这个故事告诉我，遇到困难可以求助，得到帮助后也要愿意回报别人。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "改变故事的结尾", "k": "故事表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "前文线索—人物选择—不同结果—结尾意义", "demo": "小兔追着一只发光的蝴蝶走进森林，天黑后找不到回家的路。第一个结尾是，萤火虫们排成一条明亮的小路，把它送回家；第二个结尾是，小兔发现蝴蝶其实是森林邮差，正好带着妈妈的信；第三个结尾是，小兔学会根据星星辨认方向。不同结尾会带来温暖、惊喜或成长三种感受。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍我的房间", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "整体—主要物品—位置—最喜欢之处—原因", "demo": "我的房间不大，但被我整理得很温馨。进门左边是书桌，桌上放着台灯和常用文具；右边是书架，图书按照故事、科学和历史分类。窗边有一盆我自己照顾的绿萝。房间里我最喜欢的是阅读角，那里铺着软垫，阳光好的时候特别舒服。我每天睡前都会在那里读二十分钟书。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍我最喜欢的物品", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "外形—用途—来源—相关故事—意义", "demo": "我最喜欢的物品是一支蓝色钢笔，它是爸爸在我十岁生日时送给我的。笔帽上刻着一颗小星星，握起来很舒服。我第一次用它写下了自己的名字，也用它记录旅行日记。每当学习遇到困难，我看到那颗星星，就会想起爸爸说的“慢慢写，认真做”。所以它不仅是一支笔，也是一份鼓励。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍喜欢的动物", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "长什么样—喜欢什么—习惯—故事—喜欢原因", "demo": "我最喜欢的动物是海豚。它有光滑的身体和弯弯的嘴巴，看起来像一直在微笑。海豚用声音交流，也会互相合作寻找食物。我看纪录片时发现，一只海豚受伤后，其他海豚会托着它浮出水面呼吸。我喜欢海豚，不只是因为它聪明，还因为它们懂得合作和照顾同伴。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍我的一天", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "早上—上午—中午—下午—晚上—重点感受", "demo": "今天最有意义的事情发生在下午。科学课上，我们小组要搭一座纸桥。一开始纸桥总是塌下来，大家有些着急。我提出把纸折成三角形，再让同学分工测试承重。经过三次调整，纸桥终于托住了五本书。放学时，我觉得特别充实，因为我不仅学到了结构知识，也学会了听取伙伴的意见。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍一次旅行", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "地点人物—所见所做—难忘细节—旅行感受", "demo": "去年秋天，我和家人去了海边。清晨，我们在沙滩上看日出，太阳从海平面慢慢升起，把海水染成了金色。白天，我第一次捡到完整的贝壳，还观察了小螃蟹怎样钻进沙洞。最难忘的是大家一起清理留在沙滩上的塑料瓶。这次旅行让我欣赏了大海，也更懂得保护自然。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "介绍我会做的一项家务", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "准备—步骤—步骤—检查—劳动收获", "demo": "我会独立整理自己的书桌。开始前，我先准备垃圾袋和抹布。第一步，把不用的纸张分类处理；第二步，把书本按照大小摆回书架；第三步，用微湿的抹布擦干净桌面。最后，我检查抽屉和文具是否归位。整理完成后，找东西更方便，写作业时心情也更安静。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "制订我的周末计划", "k": "生活表达", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "做什么—为什么—何时做—准备什么—期待收获", "demo": "这个周末我准备完成三件事。周六上午先写完作业，并留二十分钟检查；下午和爸爸去游泳，继续练习换气；晚上整理本周错题。周日上午，我想去图书馆借一本历史书，下午帮助家里收拾房间。我会给每件事安排休息时间，不把计划排得太满，希望周末既有收获，也能放松。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 41 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "你好，我叫安然，是三年级二班的学生。刚才听老师介绍，你也喜欢画画，我平时最喜欢画小动物。你喜欢画什么呢？如果课间有时间，我们可以一起看看彼此的画，也可以一起熟悉校园。食堂和图书馆的位置我比较熟，如果你找不到可以问我。很高兴认识你，希望我们能成为朋友。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 43 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "老师您好，刚才讲到分数比较大小时，我前面的步骤听懂了，知道要先看分母。但是分母不同时怎样转换，我还不太明白。我试着按照例题做了一遍，做到第二步就卡住了。您可以再讲一下为什么要找公分母吗？我想把这个关键步骤弄清楚，谢谢老师。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 44 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "小宇，不好意思，我今天整理书包时漏装了直尺，数学课马上要画图。请问你的直尺现在方便借我用一下吗？我用完这道题就马上还给你，不会带出教室。如果你等会儿也要用，我可以先去向老师说明。谢谢你愿意帮我，下次我会在出门前认真检查文具。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 45 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "我们的任务是制作一张“保护校园环境”的海报。小雨擅长画画，可以负责插图；乐乐查资料很快，可以整理三条环保建议；我来设计标题并负责最后汇报。大家今天放学前完成初稿，明天早上一起检查内容和错别字。如果有人遇到困难，要及时在小组里说明，我们一起调整，不让任务积到最后。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 46 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "大家好，我们小组研究的主题是“怎样减少校园里的塑料垃圾”。我们先观察了教室和食堂，又记录一周内常见的塑料用品。小组成员分别负责调查、整理数据和制作海报。我们发现一次性水杯使用较多，因此提出自带水杯、设置分类箱和开展旧物交换三个建议。过程中最大的困难是数据不完整，后来我们补做了两次记录。以上是我们的汇报，谢谢大家。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 47 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "尊敬的老师、亲爱的同学们，大家好，我叫陈星宇，今天竞选学习委员。我做事认真，也愿意帮助同学。上学期的小组学习中，我曾把大家容易出错的题整理成卡片，帮助小组提高了复习效率。如果当选，我会每周收集学习问题，及时向老师反馈，也会组织同学互相讲题。我会听取大家的意见，用行动为班级服务。请支持我，谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 48 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "大家好，今天我想分享一本书——《昆虫记》。作者没有把昆虫写成冷冰冰的知识，而是像观察朋友一样记录它们的生活。我印象最深的是蚂蚁合作搬运食物的场景，它们力量不大，却能通过合作完成困难任务。这本书让我学会耐心观察，也让我明白小生命同样值得尊重。如果你喜欢自然，我很推荐这本书。谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 49 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "今天能够获得“阅读之星”，我非常开心。首先感谢老师给我推荐了许多好书，也感谢爸爸妈妈每天陪我保留阅读时间。这个奖不是说明我已经做得最好，而是提醒我继续坚持。阅读让我认识了更大的世界，也让我表达时有了更多内容。接下来，我会尝试做好读书笔记，并把喜欢的故事分享给同学。谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "第 50 节", "k": "校园实战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "demo": "尊敬的老师、亲爱的同学们，大家好！欢迎来到三年级二班故事分享会。今天，五位同学将带我们走进不同的故事世界。首先有请一号选手为大家讲述《勇敢的小松鼠》，掌声欢迎！感谢他的精彩分享，接下来出场的是二号选手。所有节目结束后，让我们再次用掌声感谢每位讲述者。今天的故事会到此结束，谢谢大家！练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "做错事情怎样道歉", "k": "礼貌沟通", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "承认—影响—道歉—补救—改进", "demo": "乐乐，对不起，我刚才跑得太快，不小心撞倒了你的积木作品。它是你花了很长时间搭好的，我知道你一定很难过。这件事是我没有注意周围造成的，我不找借口。我愿意和你一起把积木重新搭好，也会把散落的积木全部捡回来。以后在教室里我会慢慢走，请你接受我的道歉。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "怎样礼貌拒绝别人", "k": "礼貌沟通", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "感谢—明确拒绝—简单原因—其他办法", "demo": "谢谢你邀请我放学后一起去公园玩，不过今天我不能去，因为妈妈还不知道这个安排，我也要先完成作业。我不想悄悄跟着走，这样家人会担心。我们可以先各自回家，征得家长同意后，再约周末白天一起玩。如果今天不方便改时间，也没关系，希望你们玩得开心。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "被误会或发生矛盾怎么办", "k": "礼貌沟通", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "暂停情绪—事实—感受—倾听—共同方案", "demo": "小航，我想把刚才的事情说清楚。你的画掉在地上时，我正好从旁边经过，但不是我故意碰掉的。你直接说是我弄的，我心里有点委屈。不过我也愿意听听你看到了什么。我们可以一起问旁边的同学，再把画整理好。无论是谁不小心碰到，先解决问题比互相生气更重要。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "怎样请求帮助", "k": "礼貌沟通", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "问题—尝试—具体请求—表达感谢", "demo": "老师您好，我的科学小制作现在遇到了一个问题。风车已经装好了，但叶片转不起来。我检查过纸片大小，也重新固定了中心位置，还是没有解决。您能帮我看一下，是不是叶片角度不对吗？我希望先听一个提示，再自己尝试修改。谢谢老师，我会把解决方法记录下来。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "清楚表达自己的需求", "k": "礼貌沟通", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "礼貌称呼—说明困难—说出需求—商量办法—表达感谢", "demo": "妈妈，我想和您商量一件事。最近我写作业时，客厅的电视声音比较大，我容易分心。我已经试过关上房门，但还是能听见。我希望每天晚上七点到八点写作业时，电视声音可以调小一些，或者我去书房学习。您觉得哪种办法更合适？谢谢您愿意听我说。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}, {"t": "小记者采访挑战", "k": "趣味角色挑战", "tip": ["先读熟示范，再换成自己的真实信息", "不看完整稿，只用结构卡完成表达", "说完回听一遍，检查内容、声音、顺序和感染力"], "chain": "礼貌问候—说明主题—开放提问—认真追问—总结感谢", "demo": "大家好，我是校园小记者安安，今天想采访同学们最喜欢的课外活动。你好，请问你平时最喜欢什么活动？你是从什么时候开始喜欢它的？练习过程中遇到过什么困难？原来你通过每天坚持解决了问题。如果让你推荐给其他同学，你最想说什么？谢谢你接受采访。通过今天的交流，我发现兴趣不仅带来快乐，也会教会我们坚持。练习时，我还会补充一个自己的真实细节，并在结尾说出这件事带给我的思考。"}]}, "speech": {"name": "演讲技巧营", "ico": "📣", "theme": {"c": "#e07840", "soft": "#fae3d5", "deep": "#b5561f"}, "desc": "30 节场景演讲课：自我介绍、开场、述职、竞聘、主持、致辞……覆盖成年人最常见的上台时刻。", "days": [{"t": "四个一自我介绍", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "第一次参加课程、社群或正式活动", "demo": "大家好，我叫沛霖，大家也可以叫我\"表达教练沛霖\"。我是一名口才表达教练，也是AI口才练习小程序的开发者。过去八年，我一直专注于口才表达、职场沟通和高情商沟通训练，陪伴很多学员从害怕上台、开口紧张，走到能够清晰汇报、从容演讲。现在，我把多年训练方法和数字工具结合，希望让大家不受时间地点限制，每天都能开口练习。今天我会分享一套可以立刻使用的表达方法，希望帮助大家从不敢说到敢说，从不会说到会说，最终成为自信、有逻辑、有影响力的表达者。"}, {"t": "新员工入职自我介绍", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "入职第一天在部门会议上介绍自己", "demo": "各位同事大家好，我是新加入运营组的林然，接下来主要负责用户活动和数据复盘。过去三年我做过社群增长和内容项目，比较擅长把复杂任务拆成清单并跟进落地。刚加入团队，还有很多业务需要向大家学习。如果后面有活动策划、数据整理或跨部门协作需要配合，可以直接找我。我也会尽快熟悉流程，争取在第一个月独立承担项目，为团队减少沟通成本。"}, {"t": "面试自我介绍突出匹配度", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "面试官已经看过简历，请你做自我介绍", "demo": "您好，我有三年新媒体运营经验，过去主要负责账号内容策划、用户增长和数据复盘。上一份工作中，我从零搭建选题机制，用三个月把账号月均互动提升了百分之四十。我的优势不是只会写内容，而是能根据数据快速调整策略。我关注到贵岗位强调用户洞察和项目推进，这与我过去的经验高度匹配。如果有机会加入，我希望尽快熟悉产品，把内容能力转化为稳定的业务结果。"}, {"t": "创业者项目路演开场", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "向潜在合作方介绍一个新项目", "demo": "各位好，我们先看一个常见场景：很多人知道表达重要，却很难每天找到老师、场地和完整时间练习。我们开发这套产品，就是把学习拆成随时可以完成的场景训练。用户可以看方法、读话术、录音复盘，再通过连续记录看见进步。目前我们已经完成核心功能验证，下一步希望联合内容和渠道伙伴，把高质量训练带给更多真正需要开口的人。接下来我会用三个部分说明用户需求、产品方案和合作价值。"}, {"t": "个人品牌介绍", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "第一次面对潜在客户介绍自己的专业服务", "demo": "大家好，我专注帮助职场人解决三个常见问题：有想法却说不清、汇报没有重点、关键场合不敢开口。我不会只教华丽话术，而是从真实工作场景出发，帮你搭结构、改表达、做录音复盘。过去的训练中，很多学员先从一次三分钟汇报开始，逐步建立稳定表达能力。如果你也有具体场景，可以先告诉我对象、目的和难点，我们从一段真正要说的话开始调整。"}, {"t": "演讲开场用问题抓住听众", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "正式分享开始，听众注意力还没有集中", "demo": "如果明天的会议突然让你发言，你最担心的是没有内容，还是脑子里有很多内容却说不清？多数人不是没有想法，而是缺少一个能在紧张时调用的结构。今天我不会讲空泛的\"自信一点\"，而是分享三个马上能用的方法：怎样快速确定观点、怎样把内容讲成三点、怎样在忘词时继续说下去。听完以后，你至少能带走一套下次会议就能使用的表达流程。"}, {"t": "用故事开场建立共鸣", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "分享成长经历或课程方法", "demo": "八年前，我第一次站上讲台时，手里攥着写满字的稿子，却在抬头的一瞬间忘了第一句话。那次经历让我明白，真正困住人的不是口才不好，而是从来没有在安全环境里反复练过。后来我把每次表达拆成一个个小场景：先说清一句，再讲完整一段，最后面对真实听众。今天我想把这条走过的路分享给你，让练习不再靠勇气，而是靠方法。"}, {"t": "观点型演讲用三点结构", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "需要围绕一个主题做清晰论述", "demo": "我认为，表达能力不是少数人的天赋，而是一项可以训练的基本能力。第一，结构能够训练，我们可以用结论和分点让内容更清楚；第二，状态能够训练，反复录音会降低对开口的陌生感；第三，场景能够训练，汇报、沟通和演讲都有规律可循。很多人的变化并非突然变得能说，而是每天修正一个小问题。所以，提升表达最有效的方法不是等待自信，而是开始一次具体练习。"}, {"t": "经验分享讲清方法过程", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "复盘一个成功项目或个人成长经历", "demo": "这个项目最初的问题不是团队不努力，而是每个人理解的目标不同。我们先开一次会议统一结果标准，再把任务拆到负责人和截止时间，最后建立每周固定复盘。过程中最大的阻力是大家觉得记录麻烦，所以我把表格缩减到只保留进度、风险和下一步。一个月后，重复沟通明显减少。这个经历给我的启发是：方法能不能落地，不看它多完整，而看使用者愿不愿意持续执行。"}, {"t": "产品发布介绍价值", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "向客户或用户介绍一个产品", "demo": "这不是一个让你收藏很多知识却不行动的工具。打开以后，你先看到今天可以完成的练习；想深入提升时，再进入真实场景课程，学习结构、示范话术和避坑方法；完成录音后，你还能回听并记录成长。我们希望解决的不是\"再看一篇口才文章\"，而是让每个人在需要表达之前，手里有方法、嘴上练过、心里有底。接下来我会现场演示一次完整使用路径。"}, {"t": "比赛演讲立意升华", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "参加主题演讲比赛，需要从故事走向观点", "demo": "我曾经以为，自信的人从来不会紧张。直到一次比赛前，我看见最优秀的选手也在后台反复深呼吸，我才明白，自信不是没有害怕，而是害怕时仍愿意向前一步。后来每次上台，我不再要求自己完美，只要求把最重要的一句话送到听众心里。我们无法等到所有准备都充分才出发，但可以在每一次不完美的开口中，慢慢成为更勇敢的自己。"}, {"t": "主持活动正式开场", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "年会、课程或主题活动开始", "demo": "尊敬的各位来宾，大家下午好。欢迎来到今天的表达成长分享会。我们因为同一个目标相聚：让想法被听见，让沟通更有效。接下来的活动分为主题分享、现场练习和互动答疑三个环节，希望大家不只听懂方法，也能真正开口体验。现在，让我们用掌声欢迎第一位分享嘉宾，为我们带来今天的主题内容。"}, {"t": "主持环节自然转场", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "上一位嘉宾结束，需要引出下一环节", "demo": "感谢刚才的分享。我们听见了方法，更看见了方法背后一次次真实练习的力量。接下来，我们会把'听懂'变成'会用'：现场将给出一个职场沟通场景，请大家按照刚才的结构完成表达。请工作人员准备材料，也请每位伙伴选好自己的练习对象。让我们带着刚才的启发，进入下一个实战环节。"}, {"t": "主持遇到设备故障", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "活动中话筒或投影临时出现问题", "demo": "各位稍等一下，现场设备正在调试，预计很快恢复。为了不让大家空等，我们先进行原计划中的互动问题：请你用一句话写下今天最想解决的表达难题。工作人员会同步收集，稍后嘉宾将优先回应。感谢大家的理解，我们会及时告知设备进展，也请大家继续保持现场秩序。"}, {"t": "获奖感言真诚有重点", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "领奖后需要发表简短但完整的感言", "demo": "听到名字时，我既惊喜，也感到一份责任。这份肯定不是我一个人的结果，感谢团队在最困难阶段依然相互补位，也感谢家人理解我一次次晚归。特别想感谢负责数据的同事，是你们把每个细节守住，才有今天的成果。这个奖不是终点，而是提醒我们继续把事情做扎实、把经验沉淀下来，创造更稳定的价值。"}, {"t": "婚礼祝福发言", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "作为朋友或家人在婚礼现场讲话", "demo": "认识新郎很多年，我最欣赏他的不是会说漂亮话，而是在朋友真正需要时总会出现。看到你们一起经历忙碌、分歧和成长，今天的幸福显得格外真实。婚姻不是只有浪漫时刻，更是在普通日子里愿意倾听、体谅和并肩解决问题。祝你们以后既有分享喜悦的热情，也有面对困难的耐心，把每一天都过成彼此安心的家。"}, {"t": "生日宴答谢来宾", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "生日聚会需要感谢亲友", "demo": "谢谢大家今天愿意放下手头的事情来陪我。过去一年有顺利，也有低谷，很多时候正是你们的一句问候、一次帮助，让我有力量继续往前。生日对我来说不只是长一岁，也提醒我要更珍惜身边真实的关系。今晚不用拘谨，希望大家吃得开心、聊得尽兴，也祝在座每个人都能被生活温柔以待。"}, {"t": "毕业典礼学生发言", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "代表毕业生回顾共同成长", "demo": "我们会记得早读时整齐又偶尔跑调的声音，也会记得运动会最后一圈全班站起来的呐喊。正是这些普通细节，让今天的告别有了重量。感谢老师不只教会答案，更教我们怎样面对不会；感谢同学让竞争之外还有陪伴。毕业不是把这段日子留在身后，而是带着它教会我们的勇气和责任，走向下一间教室。"}, {"t": "教师培训分享开场", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "面向教师介绍一种教学方法", "demo": "很多老师都遇到过这样的课堂：问题提出来了，只有少数学生举手；点名以后，孩子知道答案却说不完整。今天我们讨论的不是让每个孩子都变成演讲家，而是怎样用更清楚的提示，让孩子敢开口、能组织、愿意表达。我会分享三个可直接放进课堂的练习，并邀请大家现场体验，看看它们怎样降低学生表达门槛。"}, {"t": "公益活动发起演讲", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "邀请公众参与一项公益行动", "demo": "善意如果只有感动，很快会过去；变成具体行动，才可能真正帮助别人。我们这次计划为社区儿童建立共享阅读角，需要的不是昂贵礼物，而是适龄、完整、干净的图书和稳定的志愿整理。每一本书都会登记去向，活动结束后公开数量和使用情况。你可以捐一本书、参加一次整理，也可以把可靠信息分享给身边的人，让小行动形成长期陪伴。"}, {"t": "团队动员讲话", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "项目进入攻坚阶段，需要稳定士气", "demo": "这段时间大家都很辛苦，进度压力和临时调整是真实存在的，我们不需要假装轻松。现在最重要的目标只有一个：先确保核心功能按质量上线。今天会重新明确负责人和优先级，非关键需求暂时冻结；遇到阻塞必须当天提出，管理层负责协调资源。我们不靠加口号解决问题，而是靠信息透明、彼此补位，把每一天该完成的事情完成。"}, {"t": "复盘演讲把经验讲透", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "项目结束后向团队分享复盘", "demo": "这次项目按期完成，但过程并不完美。做对的第一件事，是提前统一了验收标准；第二件事，是每周公开风险，避免问题被隐藏。做得不足的是跨部门资料确认太晚，导致中期返工。后续我们会把关键资料前置一周确认，并增加负责人签字节点。复盘不是证明当时谁对谁错，而是让下一次少付同样的成本。"}, {"t": "课程结尾有力收束", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "演讲内容结束，需要让听众记住并行动", "demo": "今天我们从开口紧张讲到结构，再讲到真实场景练习。你不需要一次解决所有问题，只要在下一次会议前，先写下结论和三个关键词；在下一次沟通后，听一遍自己的录音。表达能力的提升没有神奇捷径，却有清楚路径：理解、模仿、练习、复盘。请从今天的一次真实开口开始，让别人更容易听懂你，也让自己的想法更有力量。"}, {"t": "招商合作推介", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "向潜在渠道说明合作价值", "demo": "我们双方服务的是同一类人：希望提升表达，却缺少持续练习环境的用户。你们拥有稳定社群和真实学习需求，我们提供结构化内容、训练工具和成长记录。合作不必一开始铺得很大，可以先选一个社群进行两周体验，观察参与率、完成率和用户反馈，再决定后续规模。我们愿意提供内容支持和数据复盘，让合作价值能够被验证，而不是停留在口头承诺。"}, {"t": "竞聘管理岗位演讲", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "内部竞聘负责人，需要讲清能力与计划", "demo": "我竞聘这个岗位，不是因为我掌握所有答案，而是过去两年持续承担了项目推进、跨部门协调和新人培养。面对目标，我习惯先统一结果，再拆责任和风险。如果有机会负责团队，前三个月我会完成流程盘点、关键岗位沟通和周复盘机制建设。我的承诺不是让所有问题立刻消失，而是让目标更透明、协作更顺畅、问题更早被看见和解决。"}, {"t": "述职演讲突出结果", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "阶段述职需要呈现贡献而非流水账", "demo": "本阶段我的核心目标是提升项目交付稳定性。结果上，负责的四个项目全部按节点上线，返工次数比上阶段下降三成。我的主要动作是前置确认需求、建立风险清单，并把每周沟通固定下来。不足之处是部分数据沉淀不够及时，影响复盘效率。下一阶段我会完善模板，并把经验转化成团队可复用的方法，而不只是个人完成任务。"}, {"t": "直播开场留住观众", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "知识类直播开场，需要快速说明价值", "demo": "刚进入直播间的朋友，如果你一到汇报就紧张、脑子里有内容却讲不清，今天这场很适合你。接下来我会现场拆解自我介绍、工作汇报和临时发言三个场景，每个场景都给可以直接套用的结构。你可以把自己最怕的场合打在评论区，我会优先选真实问题示范。先别急着记很多笔记，找到一个今晚就能练的方法最重要。"}, {"t": "短视频口播完整表达", "k": "演讲技巧", "tip": ["第一轮：模仿示范说一遍", "第二轮：换成你自己的真实场景", "第三轮：不看稿，按自己的话完整表达"], "scene": "录制知识类短视频，需要自然有节奏", "demo": "很多人汇报没重点，不是因为表达差，而是开口前没有确定希望领导做什么。比如你讲项目延期，如果只解释过程，领导仍不知道新节点和需要的支持。更有效的说法是先给结论，再交代 function campData(cid){
  if(!store.camps[cid]) store.camps[cid] = {checkins:{}};
  return store.camps[cid];
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function doneCount(cid){
  const c = campData(cid).checkins, N = CAMPS[cid].days.length;
  let n = 0;
  for(let i=1;i<=N;i++){ if(c[i]) n++; else break; }
  return n;
}
function totalCheckins(cid){ return Object.keys(campData(cid).checkins).length; }
function checkedToday(cid){
  const c = campData(cid).checkins, td = todayStr();
  return Object.values(c).some(v => v.date === td);
}
function calcStreaks(cid){
  const dates = Object.values(campData(cid).checkins).map(v=>v.date);
  const set = new Set(dates);
  if(!set.size) return {cur:0, max:0};
  const toD = s => { const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); };
  const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const sorted = [...set].sort();
  let max=1, run=1;
  for(let i=1;i<sorted.length;i++){
    const diff = (toD(sorted[i]) - toD(sorted[i-1]))/86400000;
    run = (diff===1) ? run+1 : 1;
    if(run>max) max=run;
  }
  let cur=0;
  let d = new Date();
  if(!set.has(fmt(d))) d = new Date(d.getTime()-86400000);
  while(set.has(fmt(d))){ cur++; d = new Date(d.getTime()-86400000); }
  return {cur, max:Math.max(max,cur)};
}

      d.demo.split("\n").filter(Boolean).map(function(p){return '<p style="margin-bottom:8px">'+p+'</p>'}).join("") + '</div>';
  } else if(d.pending){
    h += '<div class="lh">🎙 示范话术</div><div class="demo pending">这一节的示范话术还没收录进知识库（待补充），先按结构卡和练习提示开口，收录后我会补上。</div>';
  }
  if(d.tip && d.tip.length){
    h += '<div class="lh">📝 今天怎么练</div><ul class="tiplist">' +
      d.tip.map(function(t){return '<li>'+t+'</li>'}).join("") + '</ul>';
  }
  return h + '</div>';
}

/* ================= 路由与渲染 ================= */
let curCamp = null;
let selRate = null;
const app = document.getElementById("app");

function applyTheme(cid){
  const t = CAMPS[cid].theme;
  const b = document.body.style;
  b.setProperty("--theme", t.c);
  b.setProperty("--theme-soft", t.soft);
  b.setProperty("--theme-deep", t.deep);
}
function resetTheme(){
  const b = document.body.style;
  b.setProperty("--theme", "#e8943a");
  b.setProperty("--theme-soft", "#fbe9d2");
  b.setProperty("--theme-deep", "#b96f1c");
}
function goHome(){ curCamp=null; resetTheme(); render(); window.scrollTo(0,0); }
function goCamp(cid){ curCamp=cid; selRate=null; applyTheme(cid); render(); window.scrollTo(0,0); }
function switchCamp(){
  let h = '<h3>换个营练练</h3><p class="meta">各营进度互不影响，随时切换</p>';
  GROUPS.forEach(function(g){
    h += '<div class="gl">'+g.g+'</div>';
    g.ids.forEach(function(id){
      if(id===curCamp) return;
      const c = CAMPS[id], n = totalCheckins(id);
      h += '<button class="ghostbtn" onclick="closeSheet();goCamp(\''+id+'\')">'+c.ico+' '+c.name+'（'+n+'/'+c.days.length+' 天）</button>';
    });
  });
  h += '<button class="ghostbtn" onclick="closeSheet()">取消</button>';
  openSheet(h);
}

function render(){
  if(!curCamp) renderHome(); else renderCamp();
}

/* ---------- 首页：选营 ---------- */
function renderHome(){
  let cards = "";
  GROUPS.forEach(function(g){
    cards += '<div class="groupt">'+g.g+'</div>';
    g.ids.forEach(function(cid){
      const c = CAMPS[cid], N = c.days.length, n = totalCheckins(cid), cur = Math.min(n+1, N);
      const pct = Math.round(n/N*100);
      const status = n>=N ? "🏆 已毕业" : (n===0 ? "尚未开始 · 点我开营" : "进行中 · 今天练第 "+cur+" 天");
      cards += `
      <button class="campcard" onclick="goCamp('${cid}')">
        <div class="cname"><span class="cico" style="background:${c.theme.soft}">${c.ico}</span>${c.name}</div>
        <div class="cdesc">${c.desc}</div>
        <div class="cprog">
          <div class="bar"><i style="width:${pct}%;background:${c.theme.c}"></i></div>
          <div class="pnum" style="color:${c.theme.deep}">${status} ｜ 已打卡 ${n} / ${N} 天</div>
        </div>
      </button>`;
    });
  });

  app.innerHTML = `
    <div class="hero">
      <h1>🦐 AI口才训练营</h1>
      <p>七个营各练各的，进度互不影响<br>选一个营，今天就开始练</p>
    </div>
    ${cards}
    <div class="sect">🗂 数据管理</div>
    <div class="cardbox">
      <button class="ghostbtn" onclick="doExport()">⬇️ 导出全部数据（所有营一起）</button>
      <button class="ghostbtn" onclick="document.getElementById('importFile').click()">⬆️ 导入数据（整体恢复）</button>
      <div class="datamsg" id="datamsg">数据只保存在本机浏览器，不上传服务器</div>
    </div>
    <div class="footer">AI口才训练营 · 试用版 v0.3<br>练习记录仅保存在本机 · 支持导出备份</div>`;
}

/* ---------- 营内主页 ---------- */
function renderCamp(){
  const c = CAMPS[curCamp], N = c.days.length;
  const n = totalCheckins(curCamp);
  const nextDay = Math.min(doneCount(curCamp)+1, N);
  const isToday = !checkedToday(curCamp) && n < N;
  const {cur, max} = calcStreaks(curCamp);

  let stars = "";
  for(let i=1;i<=N;i++){
    const done = !!campData(curCamp).checkins[i];
    const isNext = (i===nextDay && n<N);
    let cls = "star", ico = "";
    if(done){ cls+=" done"; ico="⭐"; }
    else if(isNext){ cls+=" today"; ico = isToday ? "👇" : "✅"; }
    else ico = "🔒";
    const click = done ? `onclick="showDay(${i})"` : (isNext ? `onclick="scrollToCheckin()"` : "");
    stars += `<button class="${cls}" ${click}><span class="ds">${ico}</span><span class="dn">${i}</span></button>`;
  }

  const badges = campBadges(curCamp).map(b=>{
    const on = n >= b.need;
    return `<div class="badge ${on?"on "+b.cls:""}">
      <div class="bi">${b.ico}</div><div class="bn">${b.name}</div>
      <div class="bc">${on?"已点亮":"满"+b.need+"天"}</div></div>`;
  }).join("");

  let checkinHtml = "";
  if(n>=N){
    checkinHtml = `<div class="checkin" id="checkinBox" style="text-align:center">
      <div style="font-size:40px">🏆</div>
      <h3>恭喜毕业！${N} 天全部完成</h3>
      <p class="ctip">可以导出数据留作纪念，或回到首页看看其他营。</p></div>`;
  } else if(checkedToday(curCamp)){
    const rec = Object.values(campData(curCamp).checkins).find(v=>v.date===todayStr());
    const r = RATES.find(x=>x.k===(rec&&rec.rating));
    checkinHtml = `<div class="checkin" id="checkinBox" style="text-align:center">
      <div style="font-size:40px">✅</div>
      <h3>今天已打卡（第 ${n} 天）</h3>
      <p class="ctip">自评：${r?r.label:"—"}<br>明天再来，继续保持连续坚持！</p></div>`;
  } else {
    const d = c.days[nextDay-1];
    const rates = RATES.map(r=>`<button class="rate" data-k="${r.k}" onclick="pickRate(this)">${r.label}</button>`).join("");
    checkinHtml = `<div class="checkin" id="checkinBox">
      <span class="daytag">今天 · 第 ${nextDay} 天 · ${d.k}</span>
      <h3>${d.t}</h3>
      ${d.scene ? `<p class="ctip">场景：${d.scene}</p>` : ""}
      ${lessonHtml(curCamp, nextDay)}
      <div class="rate-row">${rates}</div>
      <button class="bigbtn" id="checkinBtn" disabled onclick="doCheckin()">选个自评，完成今天打卡</button>
    </div>`;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="tbtn" onclick="goHome()">‹ 首页</button>
      <div class="tt">${c.ico} ${c.name}</div>
      <button class="tbtn switch" onclick="switchCamp()">换营 ⇄</button>
    </div>

    <div class="sect">🗺 ${N} 格坚持星图</div>
    <div class="cardbox">
      <div class="starmap">${stars}</div>
      <div class="legend">
        <span><i style="background:var(--theme)"></i>已完成</span>
        <span><i style="background:var(--theme-soft);border:1.5px solid var(--theme)"></i>今日待打卡</span>
        <span><i style="background:#faf6ee;border:1.5px solid var(--line)"></i>将开启</span>
      </div>
    </div>

    <div class="sect">🏅 我的勋章</div>
    <div class="badges">${badges}</div>

    <div class="sect">📊 核心指标</div>
    <div class="stats">
      <div class="stat"><div class="sv">${n}</div><div class="sl">累计打卡（天）</div></div>
      <div class="stat"><div class="sv">${cur}</div><div class="sl">连续坚持（天）</div></div>
      <div class="stat"><div class="sv">${max}</div><div class="sl">历史最长连续（天）</div></div>
      <div class="stat"><div class="sv">${n}</div><div class="sl">开口次数（次）</div></div>
    </div>

    <div class="sect">✍️ 今日练习</div>
    ${checkinHtml}

    <div class="footer">当前营：${c.name}<br>进度按营独立保存 · 点「换营」可随时切换</div>`;
}

/* ---------- 交互 ---------- */
function pickRate(el){
  document.querySelectorAll(".rate").forEach(b=>b.classList.remove("sel"));
  el.classList.add("sel");
  selRate = el.dataset.k;
  const btn = document.getElementById("checkinBtn");
  btn.disabled = false;
  btn.textContent = "完成今天打卡 ✅";
}
function doCheckin(){
  if(!selRate) return;
  const nextDay = doneCount(curCamp)+1;
  if(nextDay > CAMPS[curCamp].days.length) return;
  campData(curCamp).checkins[nextDay] = { date: todayStr(), rating: selRate };
  saveStore();
  const n = totalCheckins(curCamp);
  selRate = null;
  renderCamp();
  const b = campBadges(curCamp).find(x=>x.need===n);
  if(b){
    openSheet(`<div style="text-align:center">
      <div style="font-size:56px">${b.ico}</div>
      <h3 style="margin-top:8px">点亮勋章：${b.name}</h3>
      <p class="meta">已坚持打卡 ${n} 天，继续加油！</p>
      <button class="bigbtn" onclick="closeSheet()">太好啦</button></div>`);
  }
}
function scrollToCheckin(){
  const el = document.getElementById("checkinBox");
  if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
}
function showDay(i){
  const rec = campData(curCamp).checkins[i];
  const d = CAMPS[curCamp].days[i-1];
  const r = rec ? RATES.find(x=>x.k===rec.rating) : null;
  openSheet(`
    <span class="daytag" style="display:inline-block;background:var(--theme);color:#fff;font-size:13.5px;font-weight:700;padding:3px 12px;border-radius:99px">第 ${i} 天 · ${d.k}</span>
    <h3 style="margin-top:10px">${d.t}</h3>
    ${rec ? `<div class="body">📅 打卡日期：${rec.date}<br>🎙 自评：${r?r.label:"—"}</div>` : ""}
    ${lessonHtml(curCamp, i)}
    <button class="ghostbtn" onclick="closeSheet()">关闭</button>`);
}
function openSheet(html){
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("mask").classList.remove("hidden");
}
function closeSheet(e){
  if(e && e.target.id !== "mask") return;
  document.getElementById("mask").classList.add("hidden");
}

/* ---------- 导出 / 导入 ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "AI口才训练营-数据备份-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  msg("已导出，所有营的数据都在这个文件里");
}
function doImport(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const s = JSON.parse(rd.result);
      if(!s.camps) throw 0;
      store = s; saveStore();
      msg("导入成功，已恢复所有营的数据");
      render();
    }catch(e){ msg("文件不对，导入失败"); }
  };
  rd.readAsText(f);
  ev.target.value = "";
}
function msg(t){
  const el = document.getElementById("datamsg");
  if(el){ el.textContent = t; }
}

/* 种子库深链：AI口才训练营.html#camp=speech 直接进对应营 */
(function(){
  const m = (location.hash||"").match(/camp=([a-z0-9]+)/i);
  if(m && CAMPS[m[1]]){ goCamp(m[1]); return; }
  render();
})();
</script>
</body>
</html>
