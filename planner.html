<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主人计划</title>
<style>
:root {
  --bg: #f5f5f0;
  --card: #ffffff;
  --border: #e8e8e3;
  --text: #2c2c2c;
  --text-dim: #999;
  --accent: #e67e22;
  --accent-light: #fef0e0;
  --red: #e74c3c;
  --red-light: #fdecea;
  --green: #27ae60;
  --green-light: #e8f8f0;
  --blue: #3498db;
  --blue-light: #eaf4fb;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
  padding-bottom: 80px;
}

/* Header */
.header {
  max-width: 1400px; margin: 0 auto;
  padding: 24px 16px 0;
}
.header h1 { font-size: 22px; font-weight: 800; }
.header h1 span { color: var(--accent); }
.header-date { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

/* Container */
.container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

/* ===== 同步状态栏 ===== */
.sync-bar {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  margin-bottom: 16px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-dim); flex: 1; min-width: 150px;
}
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.sync-time { font-size: 12px; color: var(--text-dim); }
.sync-btns { display: flex; gap: 6px; }
.sync-btn {
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text-dim); font-size: 12px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.sync-btn:hover { border-color: var(--accent); color: var(--text); }
.sync-btn.primary {
  background: var(--accent); color: #fff;
  border-color: var(--accent); font-weight: 600;
}
.sync-btn.primary:hover { background: #d35400; }

/* ===== 同步引导弹窗 ===== */
.sync-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center;
}
.sync-modal-overlay.show { display: flex; }
.sync-modal {
  background: var(--card); border-radius: 16px;
  padding: 28px; width: 90%; max-width: 460px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.sync-modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.sync-modal .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

.sync-step {
  display: flex; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.sync-step:last-child { border-bottom: none; }
.sync-step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sync-step-body { flex: 1; }
.sync-step-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.sync-step-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
.sync-step-btn {
  margin-top: 8px; padding: 8px 18px; border-radius: 8px;
  border: none; font-size: 14px; cursor: pointer;
  font-weight: 600; transition: all 0.2s;
}
.sync-step-btn.upload {
  background: var(--accent); color: #fff;
}
.sync-step-btn.upload:hover { background: #d35400; }
.sync-step-btn.download {
  background: var(--green); color: #fff;
}
.sync-step-btn.download:hover { background: #219a52; }
.sync-step-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
}

.sync-modal-footer {
  margin-top: 20px; padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.sync-modal-footer .tip {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.5;
}
.sync-modal-close {
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: none;
  color: var(--text-dim); font-size: 13px; cursor: pointer;
}

/* Habits */
.habits {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.habit-chip {
  padding: 8px 16px; border-radius: 20px;
  background: var(--card); border: 1.5px solid var(--border);
  font-size: 14px; cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.habit-chip:active { transform: scale(0.96); }
.habit-chip.active {
  background: var(--green-light); border-color: var(--green);
  color: var(--green); text-decoration: line-through;
}

/* ===== 分类筛选栏 ===== */
.filter-bar {
  display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
}
.filter-btn {
  padding: 5px 14px; border-radius: 16px;
  border: 1.5px solid var(--border); background: none;
  font-size: 13px; cursor: pointer; transition: 0.15s;
  color: var(--text-dim); user-select: none;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent); font-weight: 600;
}
.cat-tag {
  font-size: 11px; padding: 1px 8px; border-radius: 10px; font-weight: 500;
  display: inline-block; vertical-align: middle;
}
.cat-工作 { background: var(--blue-light); color: var(--blue); }
.cat-生活 { background: var(--green-light); color: var(--green); }

/* 分类选择器（弹窗内） */
.cat-pick {
  padding: 7px 16px; border-radius: 18px; font-size: 14px; font-weight: 500;
  cursor: pointer; border: 2px solid var(--border); background: none;
  transition: 0.15s; user-select: none;
}
.cat-pick:hover { border-color: var(--accent); }
.cat-pick.active { border-width: 2.5px; }
.cat-pick-work.active { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
.cat-pick-life.active { border-color: var(--green); background: var(--green-light); color: var(--green); }

/* Section */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 14px; font-weight: 700; color: var(--text-dim);
  margin-bottom: 10px; padding-left: 2px;
  display: flex; align-items: center; gap: 6px;
}

/* Task Item */
.task {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 8px; transition: all 0.2s;
  position: relative;
}
.task:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.task.done { opacity: 0.5; }
.task.done .task-title { text-decoration: line-through; color: var(--text-dim); }

.task-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid #ccc; cursor: pointer; flex-shrink: 0;
  margin-top: 1px; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.task-check:hover { border-color: var(--accent); }
.task-check.checked {
  background: var(--accent); border-color: var(--accent);
}
.task-check.checked::after {
  content: '\2713'; color: #fff; font-size: 13px; font-weight: bold;
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 500; word-break: break-word; }
.task-sub {
  font-size: 12px; color: var(--text-dim); margin-top: 3px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.task-tag {
  font-size: 11px; padding: 1px 8px; border-radius: 10px; font-weight: 500;
}
.tag-overdue { background: var(--red-light); color: var(--red); }
.tag-today { background: var(--accent-light); color: var(--accent); }
.tag-tomorrow { background: #fff8e1; color: #f39c12; }
.tag-week { background: var(--blue-light); color: var(--blue); }
.tag-future { background: #f0f0f0; color: #888; }
.tag-recurring { background: #f3e8ff; color: #8b5cf6; }

.task-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.task[draggable="true"] { cursor: grab; }
.task[draggable="true"]:active { cursor: grabbing; }
.task.drag-over { border-top: 3px solid var(--accent); margin-top: -2px; }
.task.drag-over-bottom { border-bottom: 3px solid var(--accent); margin-bottom: -2px; }

.habit-drag-placeholder { opacity: 0.3; }

.task-actions {
  display: flex; gap: 2px; flex-shrink: 0;
  opacity: 0.35; transition: opacity 0.15s;
}
.task:hover .task-actions { opacity: 1; }
.task-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 14px; display: flex;
  align-items: center; justify-content: center;
}
.task-btn:hover { background: #f0f0f0; }

/* Empty */
.empty { text-align: center; padding: 20px; color: var(--text-dim); font-size: 14px; }

/* FAB */
.fab {
  position: fixed; bottom: 28px; right: 28px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 28px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(230,126,34,0.4);
  transition: all 0.2s; z-index: 50;
  display: flex; align-items: center; justify-content: center;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(230,126,34,0.5); }
.fab:active { transform: scale(0.95); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  padding: 24px; width: 100%; max-width: 640px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 5px; font-weight: 600;
}
.form-group input, .form-group textarea {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; transition: border 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--accent);
}
.form-group textarea { min-height: 60px; resize: vertical; }
.modal-actions {
  display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;
}
.btn {
  padding: 10px 22px; border-radius: 8px; border: none;
  font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #d35400; }
.btn-cancel { background: var(--bg); color: var(--text-dim); }

/* Progress bar for habits */
.habit-progress {
  font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
}

.habit-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.habit-row:last-child { border-bottom: none; }
.habit-row-icon {
  font-size: 22px; width: 36px; text-align: center;
}
.habit-row-info { flex: 1; }
.habit-row-name { font-size: 15px; font-weight: 500; }
.habit-row-detail { font-size: 12px; color: var(--text-dim); }
.habit-row-del {
  width: 28px; height: 28px; border-radius: 6px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 14px;
}
.habit-row-del:hover { background: var(--red-light); color: var(--red); }
.btn-add {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1.5px dashed var(--border); background: none;
  color: var(--text-dim); font-size: 14px; cursor: pointer;
  margin-top: 12px; transition: all 0.2s;
}
.btn-add:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 历史日志弹窗 ===== */
.log-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.log-modal-overlay.show { display: flex; }
.log-modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  padding: 24px; width: 100%; max-width: 640px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.log-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.log-modal-header h2 { font-size: 17px; font-weight: 700; }
.log-month-nav {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.log-month-nav button {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; font-size: 16px; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
}
.log-month-nav button:hover { border-color: var(--accent); color: var(--accent); }
.log-month-label { font-size: 15px; font-weight: 600; flex: 1; text-align: center; }
.log-day-block { margin-bottom: 16px; }
.log-day-title {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.log-entry {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 4px; font-size: 14px;
  border-bottom: 1px solid #f0f0ec;
}
.log-entry:last-child { border-bottom: none; }
.log-entry-time { font-size: 12px; color: var(--text-dim); min-width: 20px; font-weight: 600; }
.log-entry-title { flex: 1; }
.log-empty { text-align: center; padding: 32px; color: var(--text-dim); font-size: 14px; }
.log-copy-btn {
  margin-top: 16px; width: 100%; padding: 10px;
  border-radius: 8px; border: 1px solid var(--border);
  background: none; cursor: pointer; font-size: 14px;
  color: var(--text-dim); font-weight: 500;
}
.log-copy-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 三栏布局 ===== */
.layout { display: flex; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 80px); padding: 0 16px; gap: 0; }
.sidebar {
  width: 380px; flex-shrink: 0;
  padding: 20px 16px 40px 0;
  border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto; overflow-x: hidden;
}
.center { flex: 1; min-width: 0; padding: 20px 0 80px 32px; }
.right {
  width: 360px; flex-shrink: 0;
  padding: 20px 0 80px 28px;
  border-left: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.right .section-title {
  position: sticky; top: 0; background: var(--bg);
  padding: 12px 0 8px; margin-bottom: 8px; z-index: 2;
}

/* sidebar 内的小节 */
.side-section { margin-bottom: 20px; }
.side-section-title {
  font-size: 14px; color: var(--text-dim); font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.side-habits { display: flex; gap: 6px; flex-wrap: wrap; }
.side-habit-chip {
  padding: 6px 14px; border-radius: 16px;
  background: var(--card); border: 1.5px solid var(--border);
  font-size: 14px; cursor: pointer; user-select: none;
  transition: 0.15s;
}
.side-habit-chip:active { transform: scale(0.96); }
.side-habit-chip.active { background: var(--green-light); border-color: var(--green); color: var(--green); text-decoration: line-through; }
.side-sync { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
.side-sync a { color: var(--accent); text-decoration: none; }
.side-sync a:hover { text-decoration: underline; }
.side-btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.side-btn {
  font-size: 13px; padding: 6px 14px; border-radius: 8px;
  border: 1.5px solid var(--border); background: none;
  cursor: pointer; color: var(--text-dim);
  transition: 0.15s; white-space: nowrap;
}
.side-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Responsive */
/* ===== 日历 ===== */
.calendar { margin-bottom: 0; }
.cal-nav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.cal-nav button {
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; font-size: 14px; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  transition: 0.15s;
}
.cal-nav button:hover { border-color: var(--accent); color: var(--accent); }
.cal-nav .cal-nav-label { font-size: 14px; font-weight: 700; flex: 1; text-align: center; }
.cal-nav .cal-nav-today {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; color: var(--text-dim);
}
.cal-nav .cal-nav-today:hover { border-color: var(--accent); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-weekday {
  font-size: 11px; color: var(--text-dim); text-align: center;
  padding: 4px 0; font-weight: 500;
}
.cal-weekday.weekend { color: var(--red); }
.cal-cell {
  aspect-ratio: 1; border-radius: 6px;
  text-align: center; cursor: pointer; position: relative;
  padding: 2px 0; transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 48px; font-size: 13px;
}
.cal-cell:hover { background: var(--accent-light); }
.cal-cell.today { background: var(--accent); color: #fff; }
.cal-cell.today .cal-lunar { color: rgba(255,255,255,0.75); }
.cal-cell.other-month { opacity: 0.3; pointer-events: none; }
.cal-solar { font-size: 13px; font-weight: 500; line-height: 1.2; }
.cal-cell.today .cal-solar { font-size: 14px; font-weight: 700; }
.cal-lunar { font-size: 10px; color: var(--text-dim); line-height: 1; margin-top: 1px; }
.cal-festival { font-size: 9px; line-height: 1; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: var(--red); font-weight: 500; }
.cal-holiday {
  font-size: 10px; line-height: 1; margin-top: 1px;
  white-space: nowrap; font-weight: 700;
}
.cal-holiday.rest { color: var(--red); }
.cal-holiday.work { color: #555; }
.cal-task-dot {
  display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--blue);
  margin-left: 2px; vertical-align: middle;
}

@media (min-width: 660px) {
  .modal { border-radius: 16px; margin-bottom: 40px; }
  .modal-overlay { align-items: center; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🦐 <span>主人计划</span></h1>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="side-section">
      <div class="side-section-title" style="font-size:14px;">📅 万年历</div>
      <div class="calendar" id="calendar"></div>
    </div>

    <div class="side-section">
      <div class="side-section-title">今日习惯</div>
      <div class="side-habits" id="sideHabitList"></div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:6px;" id="sideHabitProgress"></div>
    </div>

    <div class="side-section">
      <div class="side-section-title">工具</div>
      <div class="side-btn-row" style="margin-bottom:6px;">
        <button class="side-btn" onclick="openLogModal()">📖 历史日志</button>
        <button class="side-btn" id="sideCopyBtn" onclick="copyDailyLog()">📋 复制清单</button>
        <button class="side-btn" onclick="cloudSyncNow()">☁️ 从云端更新</button>
      </div>
      <div class="side-btn-row" style="margin-bottom:6px;">
        <button class="side-btn" onclick="openTokenModal()">🔑 设置Token</button>
        <button class="side-btn" onclick="openSyncModal()">📁 手动备份</button>
      </div>
      <div class="side-sync" style="font-size:11px;">
        <span id="cloudSyncStatus">正在连接...</span>
      </div>
    </div>
  </div>

  <div class="center">
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <div class="filter-bar" id="filterBar"></div>
    <div id="taskSections"></div>
  </div>

  <div class="right">
    <div id="tomorrowSection"></div>
  </div>
</div>

<script>

// ===== 农历数据 (1900-2100) =====
var lunarInfo=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0a950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];
var lunarMonth=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var lunarDay=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lYearDays(y){var i,f=348;for(i=0x8000;i>0x8;i>>=1)f+=(lunarInfo[y-1900]&i)?1:0;return f+leapDays(y);}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function leapDays(y){if(leapMonth(y))return(lunarInfo[y-1900]&0x10000)?30:29;return 0;}
function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29;}

// 公历 → 农历（修复闰月处理）
var _lunarCache = {};
function solar2lunar(y,m,d){
  var ck = y+'-'+m+'-'+d;
  if(_lunarCache[ck])return _lunarCache[ck];
  var offset=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  var ly,lm,ld,isLeap=false,i,tmp;
  for(i=1900;i<2101&&offset>0;i++)offset-=lYearDays(i);
  if(offset<0){offset+=lYearDays(i-1);i--;}
  ly=i;
  var leapM=leapMonth(ly);
  for(lm=1;lm<=12;lm++){
    if(leapM>0&&lm===leapM+1){
      tmp=leapDays(ly);offset-=tmp;
      if(offset<0){offset+=tmp;isLeap=true;break;}
    }
    tmp=monthDays(ly,lm);offset-=tmp;
    if(offset<0){offset+=tmp;isLeap=false;break;}
    isLeap=false;
  }
  ld=Math.floor(offset)+1;
  if(lm>12){lm=12;ld=monthDays(ly,12);}
  var r={lYear:ly,lMonth:lm,lDay:ld,isLeap:isLeap,monthStr:lunarMonth[lm-1],dayStr:lunarDay[ld-1]};
  _lunarCache[ck]=r;
  return r;
}

// ===== 24节气 (近似算法) =====
var sTermInfo=[0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
var sTermNames=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
var _termCache=null;
function buildTermMap(year){
  if(_termCache&&_termCache._year===year)return _termCache;
  var map={};
  for(var i=0;i<24;i++){
    var offDate=new Date((31556925974.7*(year-1900)+sTermInfo[i]*60000)+Date.UTC(1900,0,6,2,5));
    var tm=offDate.getUTCMonth()+1;
    var td=offDate.getUTCDate();
    map[tm+'-'+td]=sTermNames[i];
  }
  map._year=year;
  _termCache=map;
  return map;
}
function getSolarTerm(y,m,d){
  var map=buildTermMap(y);
  var key=m+'-'+d;
  return map[key]||'';
}

// ===== 节日数据 =====
var solarFestivals={
  '01-01':'元旦','02-14':'情人节','03-08':'妇女节','03-12':'植树节','03-15':'消费者日',
  '04-01':'愚人节','04-22':'地球日','05-01':'劳动节','05-04':'青年节','05-12':'护士节',
  '06-01':'儿童节','07-01':'建党节','07-07':'七七事变','08-01':'建军节',
  '09-10':'教师节','09-18':'九一八','10-01':'国庆节','10-31':'万圣节',
  '11-09':'消防日','12-13':'公祭日','12-24':'平安夜','12-25':'圣诞节'
};
var lunarFestivals={
  '正月初一':'春节','正月十五':'元宵节','五月初五':'端午节','七月初七':'七夕',
  '七月十五':'中元节','八月十五':'中秋节','九月初九':'重阳节','腊月初八':'腊八',
  '腊月廿三':'小年(北)','腊月廿四':'小年(南)','腊月三十':'除夕'
};
function getMothersDay(y){var d=new Date(y,4,1);d.setDate(1+(7-d.getDay())%7+7);return d;}
function getFathersDay(y){var d=new Date(y,5,1);d.setDate(1+(7-d.getDay())%7+14);return d;}
function getFloatFestival(y,m,d){
  var dt=new Date(y,m-1,d);
  var md=new Date(y,4,1);md.setDate(1+(7-md.getDay())%7+7);
  if(dt.getTime()===md.getTime())return '母亲节';
  var fd=new Date(y,5,1);fd.setDate(1+(7-fd.getDay())%7+14);
  if(dt.getTime()===fd.getTime())return '父亲节';
  var td=new Date(y,10,1);td.setDate(1+(7-td.getDay())%7+21);
  if(dt.getTime()===td.getTime())return '感恩节';
  return '';
}

// ===== 法定节假日（2026年 国务院安排，来源：www.gov.cn）=====
var _legalHolidays = {
  rest: {
    '01-01':'元旦','01-02':'元旦','01-03':'元旦',
    '02-15':'春节','02-16':'春节','02-17':'春节','02-18':'春节','02-19':'春节',
    '02-20':'春节','02-21':'春节','02-22':'春节','02-23':'春节',
    '04-04':'清明','04-05':'清明','04-06':'清明',
    '05-01':'劳动节','05-02':'劳动节','05-03':'劳动节','05-04':'劳动节','05-05':'劳动节',
    '06-19':'端午','06-20':'端午','06-21':'端午',
    '09-25':'中秋','09-26':'中秋','09-27':'中秋',
    '10-01':'国庆','10-02':'国庆','10-03':'国庆','10-04':'国庆',
    '10-05':'国庆','10-06':'国庆','10-07':'国庆'
  },
  work: {
    '01-04':1,'02-14':1,'02-28':1,'05-09':1,'09-20':1,'10-10':1
  }
};

// ===== 日历渲染 =====
var _calYear=0,_calMonth=0;

function calNavMonth(delta){
  _calMonth+=delta;
  if(_calMonth>12){_calMonth=1;_calYear++;}
  if(_calMonth<1){_calMonth=12;_calYear--;}
  renderCalendar();
}

function calGoToday(){
  var now=new Date();
  _calYear=now.getFullYear();
  _calMonth=now.getMonth()+1;
  renderCalendar();
}

function renderCalendar(){
  if(!_calYear){
    var now=new Date();
    _calYear=now.getFullYear();
    _calMonth=now.getMonth()+1;
  }
  var today=new Date();
  var todayDS=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

  // 统计未完成任务：日期 → 数量
  var _taskCount={};
  var _allTasks=loadTasks();
  for(var ti=0;ti<_allTasks.length;ti++){
    var t=_allTasks[ti];
    if(!t.done&&t.date){
      var taskDate=t.date;
      if(taskDate<todayDS) taskDate=todayDS;
      _taskCount[taskDate]=(_taskCount[taskDate]||0)+1;
    }
  }

  var wd=['一','二','三','四','五','六','日'];

  var html='';
  html+='<div class="cal-nav">';
  html+='<button onclick="calNavMonth(-1)">‹</button>';
  html+='<div class="cal-nav-label">'+_calYear+'年 '+_calMonth+'月</div>';
  html+='<button onclick="calNavMonth(1)">›</button>';
  html+='<button class="cal-nav-today" onclick="calGoToday()">今天</button>';
  html+='</div>';

  html+='<div class="cal-grid">';
  for(var i=0;i<7;i++){
    html+='<div class="cal-weekday'+(i>=5?' weekend':'')+'">'+wd[i]+'</div>';
  }

  var firstDay=new Date(_calYear,_calMonth-1,1);
  var firstDow=firstDay.getDay();
  var startOffset=firstDow===0?6:firstDow-1;
  var daysInMonth=new Date(_calYear,_calMonth,0).getDate();
  var prevMonthDays=new Date(_calYear,_calMonth-1,0).getDate();

  for(var cell=0;cell<42;cell++){
    var d,m=_calMonth,y=_calYear,isOther=false;
    if(cell<startOffset){
      d=prevMonthDays-startOffset+cell+1;
      m=_calMonth-1;
      if(m<1){m=12;y--;}
      isOther=true;
    }else if(cell-startOffset>=daysInMonth){
      d=cell-startOffset-daysInMonth+1;
      m=_calMonth+1;
      if(m>12){m=1;y++;}
      isOther=true;
    }else{
      d=cell-startOffset+1;
    }

    var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=(ds===todayDS);
    var cellClass='cal-cell';
    if(isToday)cellClass+=' today';
    if(isOther)cellClass+=' other-month';

    var lunar=solar2lunar(y,m,d);
    var lunarStr=lunar.dayStr;
    if(lunar.dayStr==='初一')lunarStr=lunar.monthStr+'月';

    // 节日/节气/法定节假日
    var festival='';
    var holidayTag='';

    // 先查法定节假日
    var hk=String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(_legalHolidays.rest[hk]){
      holidayTag='休';
      if(!festival)festival=_legalHolidays.rest[hk];
    } else if(_legalHolidays.work[hk]){
      holidayTag='班';
    }

    var mmdd=String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(solarFestivals[mmdd])festival=solarFestivals[mmdd];
    else{var ff=getFloatFestival(y,m,d);if(ff)festival=ff;}
    if(!festival){
      var lk=lunar.monthStr+'月'+lunar.dayStr;
      if(lunarFestivals[lk])festival=lunarFestivals[lk];
      else{var term=getSolarTerm(y,m,d);if(term)festival=term;}
    }
    var festHtml='';
    if(festival)festHtml='<div class="cal-festival">'+festival+'</div>';
    if(holidayTag)festHtml+='<div class="cal-holiday '+(holidayTag==='休'?'rest':'work')+'">'+holidayTag+'</div>';
    // 任务小圆点
    var dotHtml='';
    if(_taskCount[ds])dotHtml='<span class="cal-task-dot" title="'+_taskCount[ds]+'个任务"></span>';

    html+='<div class="'+cellClass+'" onclick="calClickDay('+y+','+m+','+d+')">';
    html+='<div class="cal-solar">'+d+dotHtml+'</div>';
    html+='<div class="cal-lunar">'+lunarStr+'</div>';
    html+=festHtml;
    html+='</div>';
  }
  html+='</div>';

  document.getElementById('calendar').innerHTML=html;
}

function calClickDay(y,m,d) {
  var ds = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  // 显示该日任务列表
  showDayTasks(ds, y, m, d);
}

var _dayTasksDate = '';
function showDayTasks(ds, y, m, d) {
  _dayTasksDate = ds;
  document.getElementById('dayTasksTitle').textContent = y+'年'+m+'月'+d+'日 任务';
  var tasks = loadTasks();
  var todayStr = today();
  var dayTasks = tasks.filter(function(t) {
    if (ds === todayStr) {
      // 今天：显示今天的任务 + 所有过期未完成任务
      return t.date === ds || (!t.done && t.date && t.date < todayStr);
    }
    return t.date === ds;
  });
  var html = '';
  if (!dayTasks.length) {
    html = '<div style="text-align:center;color:var(--text-dim);padding:18px 0;font-size:13px;">这天还没有任务～</div>';
  } else {
    dayTasks.forEach(function(tk) {
      var noteHtml = tk.note ? '<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">'+esc(tk.note)+'</div>' : '';
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);'+(tk.done?'opacity:0.45;':'')+'">'
        + '<div class="task-check '+(tk.done?'checked':'')+'" onclick="toggleTask(\''+tk.id+'\');showDayTasks(_dayTasksDate);"></div>'
        + '<div style="flex:1;font-size:14px;'+(tk.done?'text-decoration:line-through;':'')+'">'+esc(tk.title)+'</div>'
        + '<button style="background:none;border:none;cursor:pointer;font-size:14px;" onclick="editTask(\''+tk.id+'\');closeDayTasksModal();">✏️</button>'
        + '</div>';
    });
  }
  document.getElementById('dayTasksList').innerHTML = html;
  document.getElementById('dayTasksModal').classList.add('show');
}

function closeDayTasksModal() {
  document.getElementById('dayTasksModal').classList.remove('show');
}

function dayTasksAdd() {
  closeDayTasksModal();
  var ds = _dayTasksDate;
  var parts = ds.split('-');
  document.getElementById('modalTitle').textContent = '添加任务（'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日）';

// ===== 云端自动同步 =====
var _cloudPushTimer = null;
var _cloudPushing = false;
var _cloudLastPush = 0;
var _cloudDataSha = null;
var _cloudUpdatedAt = null; // 云端数据的时间戳
var CLOUD_REPO = 'rain60s/rain60s.github.io';
var CLOUD_FILE = 'planner-data.json';
var CLOUD_API = 'https://api.github.com/repos/' + CLOUD_REPO + '/contents/' + CLOUD_FILE;

function _getHeaders(write) {
  var h = { 'Accept': 'application/vnd.github.v3+json' };
  if (write) {
    var t = localStorage.getItem('xx_github_token');
    if (t) h['Authorization'] = 'token ' + t;
  }
  return h;
}

function _buildCloudData() {
  return {
    version: 1,
    updatedAt: new Date().toISOString(),
    tasks: loadTasks(),
    habits: loadHabits(),
    dailyLog: getDailyLog()
  };
}

function _setSyncStatus(text, color) {
  var el = document.getElementById('cloudSyncStatus');
  if (el) { el.textContent = text; if (color) el.style.color = color; }
}

// 从云端拉取数据（页面加载时自动调用）
function cloudPull() {
  _setSyncStatus('☁️ 正在拉取云端数据...');
  fetch(CLOUD_API + '?t=' + Date.now(), { headers: _getHeaders(false), cache: 'no-store' })
    .then(function(r) {
      if (r.status === 404) {
        _setSyncStatus('☁️ 云端暂无数据，可正常使用', 'var(--text-dim)');
        _cloudDataSha = null;
        _cloudUpdatedAt = null;
        return null;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data) return;
      var cloud = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      _cloudDataSha = data.sha;
      _cloudUpdatedAt = cloud.updatedAt ? new Date(cloud.updatedAt).getTime() : 0;

      // 记住拉取时的本地修改时间，用于后续判断
      localStorage.setItem('xx_pull_timestamp', String(Date.now()));

      // 如果本地数据为空（首次使用），直接用云端数据
      var hasLocalData = localStorage.getItem('xx_tasks_v2') || localStorage.getItem('xx_habits_v2');
      if (!hasLocalData) {
        if (cloud.tasks) saveTasks(cloud.tasks);
        if (cloud.habits) saveHabits(cloud.habits);
        if (cloud.dailyLog) saveDailyLog(cloud.dailyLog);
        _tasksCache = null; _habitsCache = null;
        localStorage.setItem('xx_local_modified', String(new Date(cloud.updatedAt || 0).getTime()));
        render();
        _setSyncStatus('☁️ 已从云端恢复数据', 'var(--green)');
        return;
      }

      // 如果拉取后本地没有修改过（上次拉取后没改过），且云端比本地新，自动合并
      var localModifiedStr = localStorage.getItem('xx_local_modified') || '0';
      var localModified = isNaN(Number(localModifiedStr)) ? new Date(localModifiedStr).getTime() : Number(localModifiedStr);
      // 记录拉取前的本地修改时间
      localStorage.setItem('xx_local_modified_before_pull', String(localModified));

      if (_cloudUpdatedAt > localModified) {
        var t = new Date(cloud.updatedAt);
        var timeStr = t.toLocaleString('zh-CN');
        if (confirm('☁️ 检测到云端有更新数据（' + timeStr + '）\n\n是否用云端数据覆盖本地？\n（点取消保留本地数据）')) {
          if (cloud.tasks) saveTasks(cloud.tasks);
          if (cloud.habits) saveHabits(cloud.habits);
          if (cloud.dailyLog) saveDailyLog(cloud.dailyLog);
          _tasksCache = null; _habitsCache = null;
          render();
          _setSyncStatus('☁️ 已同步云端数据 ✓', 'var(--green)');
        } else {
          _setSyncStatus('☁️ 已保留本地数据（云端更新未采纳）', '#e67e22');
        }
      } else {
        _setSyncStatus('☁️ 已连接云端 ✓', 'var(--green)');
      }
    })
    .catch(function(e) {
      _setSyncStatus('☁️ 拉取失败: ' + e.message, 'var(--text-dim)');
    });
}

var KDOCS_MCP = 'https://mcp-center.wps.cn/skill_hub/mcp';
var KDOCS_FILE = 'ziiswFhSyrMDDHQvmCk2rx2tcn6gxiPde';
var KDOCS_SHEET = 6;

function _kdocsRow(dateStr) {
  var d = new Date(dateStr);
  var md = [31,28,31,30,31,30,31,31,30,31,30,31];
  var row = 0;
  for (var m = 0; m < d.getMonth(); m++) row += md[m];
  row += d.getDate();
  return row;
}

async function syncToKDocs() {
  try {
    var log = getDailyLog();
    var key = today();
    var entries = log[key] || [];
    if (!entries.length) return;
    // 迁移旧数据
    entries.forEach(function(e) { if (!e.category) e.category = '工作'; });

    var formatted = entries.map(function(e, i) { return (i+1) + '.' + e.title; }).join('；') + '；';
    var row = _kdocsRow(key);

    // 读取 token（从 localStorage，首次从文件加载）
    var token = localStorage.getItem('xx_kdocs_token');
    if (!token) return;

    var hdrs = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      'X-Request-Source': 'workbuddy',
      'X-Skill-Version': '1.4.12'
    };

    // Step 1: MCP Initialize
    var r1 = await fetch(KDOCS_MCP, {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',
        params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'planner-sync',version:'1.0.0'}}})
    });
    var sid = r1.headers.get('Mcp-Session-Id');
    if (sid) hdrs['Mcp-Session-Id'] = sid;

    // Step 2: initialized notification
    fetch(KDOCS_MCP, {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})
    }).catch(function(){});

    // Step 3: update_range_data
    var r3 = await fetch(KDOCS_MCP, {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/call',
        params:{name:'sheet.update_range_data',arguments:{
          file_id: KDOCS_FILE, sheetId: KDOCS_SHEET,
          rangeData:[{opType:'formula',rowFrom:row,rowTo:row,colFrom:2,colTo:2,
            formula:'= "'+formatted+'"'}]
        }}})
    });
    var res = await r3.json();
    if (res.result && res.result.content && res.result.content[0]) {
      var inner = JSON.parse(res.result.content[0].text);
      if (inner.code === 0) {
        _setSyncStatus('✅ 已同步到日生记', '#27ae60');
        setTimeout(function(){ _setSyncStatus('',''); }, 3000);
      } else {
        _setSyncStatus('⚠️ 日生记同步失败: ' + (inner.message||''), '#e67e22');
      }
    }
  } catch(e) {
    console.error('KDocs sync error:', e);
    _setSyncStatus('⚠️ 日生记同步异常', '#e67e22');
    setTimeout(function(){ _setSyncStatus('',''); }, 3000);
  }
}

// 推送数据到云端（带冲突检测）
function cloudPush(force) {
  var token = localStorage.getItem('xx_github_token');
  if (!token) {
    _setSyncStatus('☁️ 未设置Token，仅可拉取', 'var(--text-dim)');
    return;
  }
  if (_cloudPushing) return;

  // 获取本地最后修改时间
  var localModifiedStr = localStorage.getItem('xx_local_modified') || '0';
  var localModified = isNaN(Number(localModifiedStr)) ? new Date(localModifiedStr).getTime() : Number(localModifiedStr);
  var lastPushTime = parseInt(localStorage.getItem('xx_last_push') || '0');

  // 如果本地没有修改过（从上次拉取到现在没改），不需要推送
  if (!force && localModified <= lastPushTime) {
    return; // 静默跳过
  }

  _cloudPushing = true;
  _setSyncStatus('⏳ 正在同步到云端...');

  // 先拉取云端最新数据检查冲突
  fetch(CLOUD_API + '?t=' + Date.now(), { headers: _getHeaders(true), cache: 'no-store' })
    .then(function(r) {
      if (r.status === 404) return { sha: null, cloudTime: 0 };
      if (!r.ok) throw new Error('获取云端状态失败: ' + r.status);
      return r.json();
    })
    .then(function(info) {
      // 解析云端数据的时间戳
      var cloudTime = 0;
      if (info.sha) {
        try {
          var cloudData = JSON.parse(decodeURIComponent(escape(atob(info.content))));
          cloudTime = cloudData.updatedAt ? new Date(cloudData.updatedAt).getTime() : 0;
        } catch(e) {}
      }

      // 冲突检测：如果云端数据比本地新，不推送
      if (!force && cloudTime > localModified) {
        _setSyncStatus('⚠️ 云端有更新，请先点击「从云端更新」拉取', '#e67e22');
        _cloudPushing = false;
        return null; // 中断推送
      }

      // 正常推送
      var payload = JSON.stringify(_buildCloudData());
      var content = btoa(unescape(encodeURIComponent(payload)));

      var body = {
        message: 'sync: ' + new Date().toLocaleString('zh-CN'),
        content: content
      };
      if (info.sha) body.sha = info.sha;

      return fetch(CLOUD_API, {
        method: 'PUT',
        headers: _getHeaders(true),
        body: JSON.stringify(body)
      });
    })
    .then(function(r) {
      if (r === null) return null;
      if (!r.ok) throw new Error('推送失败: ' + r.status);
      return r.json();
    })
    .then(function(result) {
      if (!result) return;
      _cloudDataSha = result.content.sha;
      _cloudLastPush = Date.now();
      _cloudUpdatedAt = Date.now();
      localStorage.setItem('xx_last_push', String(_cloudLastPush));
      _setSyncStatus('☁️ ' + new Date().toLocaleTimeString('zh-CN') + ' 已同步 ✓', 'var(--green)');
      _cloudPushing = false;
    })
    .catch(function(e) {
      _setSyncStatus('☁️ 同步失败: ' + e.message, 'var(--red)');
      _cloudPushing = false;
    });
}

    })

      _setSyncStatus('☁️ 同步失败: ' + e.message, 'var(--red)');
    });
}

// ===== 数据乱码修复 =====
function _isMojibake(str) {
  if (typeof str !== 'string') return false;
  // 检测常见的 UTF-8 被误读为 Latin1 的模式：连续 3 个 U+0080-U+00FF 字符
  return /[\u00c0-\u00df][\u0080-\u00bf]{2}|[\u00e0-\u00ef][\u0080-\u00bf]{2}/.test(str);
}

function _recoverString(str) {
  if (typeof str !== 'string') return str;
  try {
    var fixed = decodeURIComponent(escape(str));
    // 如果修复后没有乱码了，返回修复后的
    return _isMojibake(fixed) ? str : fixed;
  } catch(e) {
    return str; // 修复失败保留原样
  }
}

function _recoverObject(obj) {
  if (typeof obj === 'string') return _recoverString(obj);
  if (Array.isArray(obj)) return obj.map(_recoverObject);
  if (obj && typeof obj === 'object') {
    var result = {};
    for (var k in obj) {
      if (obj.hasOwnProperty(k)) {
        result[_recoverString(k)] = _recoverObject(obj[k]);
      }
    }
    return result;
  }
  return obj;
}

function autoRecoverData() {
  var tasks = loadTasks();
  var habits = loadHabits();
  var dailyLog = getDailyLog();

  var hasMojibake = false;
  function check(o) {
    if (typeof o === 'string') { if (_isMojibake(o)) hasMojibake = true; }
    else if (Array.isArray(o)) o.forEach(check);
    else if (o && typeof o === 'object') { for (var k in o) { check(k); check(o[k]); } }
  }
  check(tasks); check(habits); check(dailyLog);

  if (hasMojibake) {
    if (confirm('⚠️ 检测到数据存在乱码（可能是上次同步导致）\n\n是否自动修复？\n（修复后会刷新页面）')) {
      saveTasks(_recoverObject(tasks));
      saveHabits(_recoverObject(habits));
      saveDailyLog(_recoverObject(dailyLog));
      alert('✅ 数据已修复，页面即将刷新');
      location.reload();
      return true;
    }
  }
  return false;
}

window.addEventListener('beforeunload', function(e) {

  var localModifiedStr = localStorage.getItem('xx_local_modified') || '0';
  var localModified = isNaN(Number(localModifiedStr)) ? new Date(localModifiedStr).getTime() : Number(localModifiedStr);
  var lastPush = parseInt(localStorage.getItem('xx_last_push') || '0');
  // 本地没改过就不推
  if (localModified <= lastPush) return;

  var payload = JSON.stringify(_buildCloudData());
  var content = btoa(unescape(encodeURIComponent(payload)));
  var body = JSON.stringify({
    message: 'sync: ' + new Date().toLocaleString('zh-CN'),

    sha: _cloudDataSha
  });
  if (navigator.sendBeacon) {
    navigator.sendBeacon(CLOUD_API, new Blob([body], { type: 'application/json' }));
  }
});

// ===== 工具函数 =====
function daysDiff(dateStr) {
  if (!dateStr) return Infinity;
  const t = new Date(today()), d = new Date(dateStr);
  return Math.round((d - t) / 86400000);
}

function endOfWeek() {
  var d = new Date(), day = d.getDay();
  d.setDate(d.getDate() + (7 - day));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function dateTag(task) {
  if (task.recurrence) return '<span class="task-tag tag-recurring">🔄 ' + task.recurrence + '</span>';
  const diff = daysDiff(task.date);
  if (!task.date) return '';
  if (diff < 0) return '<span class="task-tag tag-overdue">已过期' + Math.abs(diff) + '天</span>';
  if (diff === 0) return '<span class="task-tag tag-today">今天</span>';
  if (diff === 1) return '<span class="task-tag tag-tomorrow">明天</span>';
  if (diff <= 7) return '<span class="task-tag tag-week">' + diff + '天后</span>';
  const m = new Date(task.date).getMonth()+1, d = new Date(task.date).getDate();
  return '<span class="task-tag tag-future">' + m + '月' + d + '日</span>';
}

function tomorrow() {
  var d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function categorize(tasks) {
  const t = today(), tmr = tomorrow(), we = endOfWeek();
  const r = {urgent:[], tomorrow:[], week:[], later:[], done:[]};
  tasks.forEach(tk => {
    if (tk.done) { r.done.push(tk); return; }
    if (tk.recurrence === '每天') {
      if (!tk.date || tk.date <= t) { r.urgent.push(tk); return; }
      if (tk.date === tmr) { r.tomorrow.push(tk); return; }
      r.later.push(tk); return;
    }
    if (tk.recurrence && !tk.date) { r.later.push(tk); return; }
    if (tk.date && tk.date <= t) { r.urgent.push(tk); return; }
    if (tk.date && tk.date === tmr) { r.tomorrow.push(tk); return; }
    if (tk.date && tk.date <= we) { r.week.push(tk); return; }
    r.later.push(tk);
  });
  return r;
}

function renderList(tasks) {
  if (!tasks.length) return '<div class="empty">✨ 暂无</div>';
  // 按 order 排序（先 slice 避免原地修改缓存数组）
  return tasks.slice().sort((a,b) => {
    var aHas = a.order != null, bHas = b.order != null;
    if (aHas && bHas) return a.order - b.order;
    if (aHas) return -1;
    if (bHas) return 1;
    if (a.date && b.date) return a.date.localeCompare(b.date);
    if (a.date) return -1;
    if (b.date) return 1;
    return 0;
  }).map(renderTask).join('');
}

var dragHabitIdx = null;
var habitDragged = false;
function onHabitDragStart(e, idx) {

function onHabitDrop(e, tgtIdx) {

  habitDragged = true;

// ===== 任务拖拽排序 =====
var dragTaskId = null;
var taskDragged = false;
var dropInsertBefore = true; // dragover 时实时记录插入位置
function onTaskDragStart(e, taskId) {
  dragTaskId = taskId;
  taskDragged = false;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', taskId);
  setTimeout(function() { if (e.target) e.target.style.opacity = '0.4'; }, 0);
}
function onTaskDragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var rect = el.getBoundingClientRect();
  var mid = rect.top + rect.height / 2;
  el.classList.remove('drag-over', 'drag-over-bottom');
  if (e.clientY < mid) {
    el.classList.add('drag-over');
    dropInsertBefore = true;
  } else {
    el.classList.add('drag-over-bottom');
    dropInsertBefore = false;
  }
}
function onTaskDragLeave(e, el) {
  el.classList.remove('drag-over', 'drag-over-bottom');
}
function onTaskDrop(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  taskDragged = true;
  var srcId = dragTaskId;
  if (!srcId || srcId === targetId) { onTaskDragEnd(e); return; }
  // 操作原始数组的副本，避免缓存污染
  var tasks = JSON.parse(JSON.stringify(loadTasks()));
  var srcIdx = tasks.findIndex(function(t) { return t.id === srcId; });
  var tgtIdx = tasks.findIndex(function(t) { return t.id === targetId; });
  if (srcIdx < 0 || tgtIdx < 0) { onTaskDragEnd(e); return; }
  var moved = tasks.splice(srcIdx, 1)[0];
  var newTgtIdx = tasks.findIndex(function(t) { return t.id === targetId; });
  if (dropInsertBefore) {
    tasks.splice(newTgtIdx, 0, moved);
  } else {
    tasks.splice(newTgtIdx + 1, 0, moved);
  }
  tasks.forEach(function(t, idx) { t.order = idx; });
  saveTasks(tasks);
  _tasksCache = null; // ★ 清除缓存，确保下次 render 从 localStorage 重新读取
  onTaskDragEnd(e);
  render();
}
function onTaskDragEnd(e) {
  dragTaskId = null;
  document.querySelectorAll('.task').forEach(function(el) {
    el.classList.remove('drag-over', 'drag-over-bottom');
    el.style.opacity = '';
  });
}

  // Render today sections (center)

        + '</div>'

        + '</div>';

      + '<div class="section-title">' + s.title + ' <span style="font-weight:400;color:var(--text-dim)">' + s.tasks.length + '</span></div>'
      + '<div>' + renderList(s.tasks) + '</div></div>';

// ===== Actions =====
function getDailyLog() {
  try { return JSON.parse(localStorage.getItem('xx_daily_log_v1') || '{}'); } catch(e) { return {}; }
}
function saveDailyLog(log) { localStorage.setItem('xx_daily_log_v1', JSON.stringify(log)); localStorage.setItem('xx_local_modified', String(Date.now())); updateSyncTime(); }
function addLogEntry(title, category) {
  const log = getDailyLog();
  const key = today();
  if (!log[key]) log[key] = [];
  log[key].push({ title: title, category: category || '工作' });
  saveDailyLog(log);
}
function copyDailyLog() {
  const log = getDailyLog();
  const key = today();
  const entries = log[key] || [];
  if (!entries.length) { alert('今天还没有完成任何任务～'); return; }
  // 数据迁移
  entries.forEach(function(e) { if (!e.category) e.category = '工作'; });
  var workEntries = entries.filter(function(e) { return e.category === '工作'; });
  var lifeEntries = entries.filter(function(e) { return e.category !== '工作'; });

  var lines = ['📋 ' + key + ' 今日完成（共 ' + entries.length + ' 项）', ''];
  if (workEntries.length) {
    lines.push('🟦 工作');
    workEntries.forEach(function(e, idx) { lines.push(idx + 1 + '. ' + e.title); });
    lines.push('');
  }
  if (lifeEntries.length) {
    lines.push('🟩 生活');
    lifeEntries.forEach(function(e, idx) { lines.push(idx + 1 + '. ' + e.title); });
  }
  const text = lines.join('\n');
  var btn = document.getElementById('sideCopyBtn');
  function showFeedback() {
    if (btn) { btn.textContent = '✅ 已复制！'; setTimeout(function(){ btn.textContent = '📋 复制清单'; }, 1500); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showFeedback);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showFeedback();
  }
}

function toggleTask(id) {
  if (taskDragged) { taskDragged = false; return; }
  const d = loadTasks(), t = d.find(x=>x.id===id);
  if (!t) return;
  t.done = !t.done;
  t.doneDate = t.done ? today() : null;
  if (t.done) addLogEntry(t.title, t.category);
  if (t.done) syncToKDocs();
  if (t.done && t.recurrence && t.date) {
    const dt = new Date(t.date);
    if (t.recurrence === '每天') dt.setDate(dt.getDate()+1);
    else if (t.recurrence === '每周') dt.setDate(dt.getDate()+7);
    else if (t.recurrence === '每月') dt.setMonth(dt.getMonth()+1);
    else if (t.recurrence === '每季') dt.setMonth(dt.getMonth()+3);
    else if (t.recurrence === '每年') dt.setFullYear(dt.getFullYear()+1);
    t.date = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    t.done = false;
    t.doneDate = null;
  }
  saveTasks(d); render();
}

function deleteTask(id) {
  const d = loadTasks().filter(t=>t.id!==id);
  saveTasks(d); render();
}

function editTask(id) {
  const t = loadTasks().find(x=>x.id===id);

  document.getElementById('modalTitle').textContent = '编辑';

  document.getElementById('taskTitle').value = t.title;

  pickCategory(t.category||'工作');
  document.getElementById('taskRecurrence').value = t.recurrence||'';
  document.getElementById('taskNote').value = t.note||'';
  document.getElementById('modal').classList.add('show');
  document.getElementById('taskTitle').focus();
}

  document.getElementById('taskNote').value = '';
  document.getElementById('taskRecurrence').value = '';
  document.getElementById('modal').classList.add('show');
  document.getElementById('taskTitle').focus();
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function saveTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { document.getElementById('taskTitle').style.borderColor='var(--red)'; return; }
  const editId = document.getElementById('editId').value;
  const obj = {
    title,
    date: document.getElementById('taskDate').value,
    category: document.getElementById('taskCategory').value,
    recurrence: document.getElementById('taskRecurrence').value,
    note: document.getElementById('taskNote').value.trim(),
    done: false, doneDate: null,
  };
  const d = loadTasks();
  if (editId) {
    const idx = d.findIndex(t=>t.id===editId);
    if (idx !== -1) d[idx] = {...d[idx], ...obj};
  } else {
    obj.id = Date.now().toString();
    d.push(obj);
  }
  saveTasks(d); closeModal(); render();
}

function toggleHabit(id) {
  if (habitDragged) { habitDragged = false; return; }
  const d = loadHabits(), h = d.find(x=>x.id===id);
  if (h) { h.active = !h.active; saveHabits(d); render(); }
}

// ===== Habit Management =====
let tempHabits = [];

function openHabitModal() {
  tempHabits = JSON.parse(JSON.stringify(loadHabits()));
  renderHabitModal();
  document.getElementById('habitModal').classList.add('show');
}

function closeHabitModal() {
  document.getElementById('habitModal').classList.remove('show');
}

function renderHabitModal() {
  const icons = ['🧘','📖','🏃','✍️','💤','💧','🧹','🍎','🎵','💡','📝','🧘‍♀️','🚴','🏊','🎨','🌿','💊','✨'];
  let html = '';
  html += '<div style="font-size:12px;color:var(--text-dim);margin:10px 0 6px;font-weight:600;">📌 固定习惯</div>';
  html += tempHabits.map((h, i) =>
    '<div class="habit-row" data-idx="' + i + '">'
    + '<div class="habit-row-icon"><select onchange="tempHabits[' + i + '].icon=this.value;renderHabitModal()" style="font-size:18px;border:none;background:none;cursor:pointer;outline:none;">'
    + icons.map(ic => '<option value="' + ic + '"' + (h.icon===ic?' selected':'') + '>' + ic + '</option>').join('')
    + '</select></div>'
    + '<div class="habit-row-info">'
    + '<input type="text" value="' + esc(h.name) + '" onchange="tempHabits[' + i + '].name=this.value" placeholder="习惯名称" style="font-size:15px;border:none;background:none;outline:none;width:100%;padding:2px 0;">'
    + '<input type="text" value="' + esc(h.detail||'') + '" onchange="tempHabits[' + i + '].detail=this.value" placeholder="补充说明" style="font-size:12px;color:var(--text-dim);border:none;background:none;outline:none;width:100%;padding:2px 0;">'
    + '</div>'
    + '<button class="habit-row-del" onclick="tempHabits.splice(' + i + ',1);renderHabitModal()" title="删除">🗑</button></div>'
  ).join('');
  html += '<button class="btn-add" onclick="tempHabits.push({id:\'h\'+Date.now(),icon:\'✨\',name:\'\',detail:\'\',active:false});renderHabitModal()">＋ 添加固定习惯</button>';

  document.getElementById('habitModalList').innerHTML = html;
}

function saveHabitChanges() {
  const valid = tempHabits.filter(h => h.name.trim());
  saveHabits(valid);
  closeHabitModal();
  render();
}

// Events
document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('habitModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeHabitModal(); });
document.getElementById('syncModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeSyncModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeHabitModal(); closeSyncModal(); }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) openModal();
});
