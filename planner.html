<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主人计划</title>
<style>
:root {
  --bg: #f5f5f0;
  --card: #ffffff;
  --border: #e8e8e3;
  --text: #2c2c2c;
  --text-dim: #999;
  --accent: #e67e22;
  --accent-light: #fef0e0;
  --red: #e74c3c;
  --red-light: #fdecea;
  --green: #27ae60;
  --green-light: #e8f8f0;
  --blue: #3498db;
  --blue-light: #eaf4fb;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
  padding-bottom: 80px;
}

/* Header */
.header {
  max-width: 1100px; margin: 0 auto;
  padding: 24px 16px 0;
}
.header h1 { font-size: 22px; font-weight: 800; }
.header h1 span { color: var(--accent); }
.header-date { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

/* Container */
.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* ===== 同步状态栏 ===== */
.sync-bar {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  margin-bottom: 16px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-dim); flex: 1; min-width: 150px;
}
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.sync-time { font-size: 12px; color: var(--text-dim); }
.sync-btns { display: flex; gap: 6px; }
.sync-btn {
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text-dim); font-size: 12px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.sync-btn:hover { border-color: var(--accent); color: var(--text); }
.sync-btn.primary {
  background: var(--accent); color: #fff;
  border-color: var(--accent); font-weight: 600;
}
.sync-btn.primary:hover { background: #d35400; }

/* ===== 同步引导弹窗 ===== */
.sync-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center;
}
.sync-modal-overlay.show { display: flex; }
.sync-modal {
  background: var(--card); border-radius: 16px;
  padding: 28px; width: 90%; max-width: 460px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.sync-modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.sync-modal .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

.sync-step {
  display: flex; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.sync-step:last-child { border-bottom: none; }
.sync-step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sync-step-body { flex: 1; }
.sync-step-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.sync-step-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
.sync-step-btn {
  margin-top: 8px; padding: 8px 18px; border-radius: 8px;
  border: none; font-size: 14px; cursor: pointer;
  font-weight: 600; transition: all 0.2s;
}
.sync-step-btn.upload {
  background: var(--accent); color: #fff;
}
.sync-step-btn.upload:hover { background: #d35400; }
.sync-step-btn.download {
  background: var(--green); color: #fff;
}
.sync-step-btn.download:hover { background: #219a52; }
.sync-step-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
}

.sync-modal-footer {
  margin-top: 20px; padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.sync-modal-footer .tip {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.5;
}
.sync-modal-close {
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: none;
  color: var(--text-dim); font-size: 13px; cursor: pointer;
}

/* Habits */
.habits {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.habit-chip {
  padding: 8px 16px; border-radius: 20px;
  background: var(--card); border: 1.5px solid var(--border);
  font-size: 14px; cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.habit-chip:active { transform: scale(0.96); }
.habit-chip.active {
  background: var(--green-light); border-color: var(--green);
  color: var(--green); text-decoration: line-through;
}

/* Section */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 14px; font-weight: 700; color: var(--text-dim);
  margin-bottom: 10px; padding-left: 2px;
  display: flex; align-items: center; gap: 6px;
}

/* Task Item */
.task {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 8px; transition: all 0.2s;
  position: relative;
}
.task:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.task.done { opacity: 0.5; }
.task.done .task-title { text-decoration: line-through; color: var(--text-dim); }

.task-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid #ccc; cursor: pointer; flex-shrink: 0;
  margin-top: 1px; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.task-check:hover { border-color: var(--accent); }
.task-check.checked {
  background: var(--accent); border-color: var(--accent);
}
.task-check.checked::after {
  content: '\2713'; color: #fff; font-size: 13px; font-weight: bold;
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 500; word-break: break-word; }
.task-sub {
  font-size: 12px; color: var(--text-dim); margin-top: 3px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.task-tag {
  font-size: 11px; padding: 1px 8px; border-radius: 10px; font-weight: 500;
}
.tag-overdue { background: var(--red-light); color: var(--red); }
.tag-today { background: var(--accent-light); color: var(--accent); }
.tag-tomorrow { background: #fff8e1; color: #f39c12; }
.tag-week { background: var(--blue-light); color: var(--blue); }
.tag-future { background: #f0f0f0; color: #888; }
.tag-recurring { background: #f3e8ff; color: #8b5cf6; }

.task-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.task-actions {
  display: flex; gap: 2px; flex-shrink: 0;
  opacity: 0.35; transition: opacity 0.15s;
}
.task:hover .task-actions { opacity: 1; }
.task-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 14px; display: flex;
  align-items: center; justify-content: center;
}
.task-btn:hover { background: #f0f0f0; }

/* Empty */
.empty { text-align: center; padding: 20px; color: var(--text-dim); font-size: 14px; }

/* FAB */
.fab {
  position: fixed; bottom: 28px; right: 28px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 28px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(230,126,34,0.4);
  transition: all 0.2s; z-index: 50;
  display: flex; align-items: center; justify-content: center;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(230,126,34,0.5); }
.fab:active { transform: scale(0.95); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  padding: 24px; width: 100%; max-width: 640px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 5px; font-weight: 600;
}
.form-group input, .form-group textarea {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; transition: border 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--accent);
}
.form-group textarea { min-height: 60px; resize: vertical; }
.modal-actions {
  display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;
}
.btn {
  padding: 10px 22px; border-radius: 8px; border: none;
  font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #d35400; }
.btn-cancel { background: var(--bg); color: var(--text-dim); }

/* Progress bar for habits */
.habit-progress {
  font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
}

.habit-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.habit-row:last-child { border-bottom: none; }
.habit-row-icon {
  font-size: 22px; width: 36px; text-align: center;
}
.habit-row-info { flex: 1; }
.habit-row-name { font-size: 15px; font-weight: 500; }
.habit-row-detail { font-size: 12px; color: var(--text-dim); }
.habit-row-del {
  width: 28px; height: 28px; border-radius: 6px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 14px;
}
.habit-row-del:hover { background: var(--red-light); color: var(--red); }
.btn-add {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1.5px dashed var(--border); background: none;
  color: var(--text-dim); font-size: 14px; cursor: pointer;
  margin-top: 12px; transition: all 0.2s;
}
.btn-add:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 历史日志弹窗 ===== */
.log-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.log-modal-overlay.show { display: flex; }
.log-modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  padding: 24px; width: 100%; max-width: 640px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.log-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.log-modal-header h2 { font-size: 17px; font-weight: 700; }
.log-month-nav {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.log-month-nav button {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; font-size: 16px; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
}
.log-month-nav button:hover { border-color: var(--accent); color: var(--accent); }
.log-month-label { font-size: 15px; font-weight: 600; flex: 1; text-align: center; }
.log-day-block { margin-bottom: 16px; }
.log-day-title {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.log-entry {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 4px; font-size: 14px;
  border-bottom: 1px solid #f0f0ec;
}
.log-entry:last-child { border-bottom: none; }
.log-entry-time { font-size: 12px; color: var(--text-dim); min-width: 36px; }
.log-entry-title { flex: 1; }
.log-empty { text-align: center; padding: 32px; color: var(--text-dim); font-size: 14px; }
.log-copy-btn {
  margin-top: 16px; width: 100%; padding: 10px;
  border-radius: 8px; border: 1px solid var(--border);
  background: none; cursor: pointer; font-size: 14px;
  color: var(--text-dim); font-weight: 500;
}
.log-copy-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 双栏布局 ===== */
.layout { display: flex; max-width: 1100px; margin: 0 auto; min-height: calc(100vh - 80px); padding: 0 16px; gap: 0; }
.sidebar {
  width: 270px; flex-shrink: 0;
  padding: 20px 16px 40px 0;
  border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.main { flex: 1; min-width: 0; padding: 20px 0 80px 24px; }

/* ===== 日历 ===== */
.calendar { margin-bottom: 20px; }
.cal-nav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.cal-nav button {
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; font-size: 14px; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  transition: 0.15s;
}
.cal-nav button:hover { border-color: var(--accent); color: var(--accent); }
.cal-nav .cal-nav-label { font-size: 14px; font-weight: 700; flex: 1; text-align: center; }
.cal-nav .cal-nav-today {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; color: var(--text-dim);
}
.cal-nav .cal-nav-today:hover { border-color: var(--accent); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-weekday {
  font-size: 11px; color: var(--text-dim); text-align: center;
  padding: 4px 0; font-weight: 500;
}
.cal-weekday.weekend { color: var(--red); }
.cal-cell {
  aspect-ratio: 1.1; border-radius: 6px;
  text-align: center; cursor: pointer; position: relative;
  padding: 2px; transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 46px;
}
.cal-cell:hover { background: var(--accent-light); }
.cal-cell.today { background: var(--accent); color: #fff; }
.cal-cell.today .cal-lunar { color: rgba(255,255,255,0.75); }
.cal-cell.today .cal-badges { filter: none; }
.cal-cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-cell.other-month { opacity: 0.3; pointer-events: none; }
.cal-solar { font-size: 14px; font-weight: 500; line-height: 1; }
.cal-cell.today .cal-solar { font-size: 15px; font-weight: 700; }
.cal-lunar { font-size: 10px; color: var(--text-dim); line-height: 1; margin-top: 1px; }
.cal-cell.holiday .cal-lunar { color: var(--red); font-weight: 500; }
.cal-cell.workday .cal-lunar { color: var(--accent); font-weight: 500; }
.cal-badges { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 2px; min-height: 12px; }
.cal-badge {
  width: 6px; height: 6px; border-radius: 50%;
}
.cal-badge.urgent { background: var(--red); }
.cal-badge.normal { background: var(--accent); }
.cal-badge.later { background: #ccc; }
.cal-festival {
  font-size: 9px; line-height: 1; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.cal-cell.holiday .cal-festival { color: var(--red); font-weight: 500; }
.cal-cell.workday .cal-festival { color: var(--accent); font-weight: 500; }

/* sidebar 内的小节 */
.side-section { margin-bottom: 18px; }
.side-section-title {
  font-size: 11px; color: var(--text-dim); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.side-habits { display: flex; gap: 4px; flex-wrap: wrap; }
.side-habit-chip {
  padding: 4px 10px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 12px; cursor: pointer; user-select: none;
  transition: 0.15s;
}
.side-habit-chip:active { transform: scale(0.96); }
.side-habit-chip.active { background: var(--green-light); border-color: var(--green); color: var(--green); text-decoration: line-through; }
.side-sync { font-size: 11px; color: var(--text-dim); line-height: 1.8; }
.side-sync a { color: var(--accent); text-decoration: none; }
.side-sync a:hover { text-decoration: underline; }
.side-btn-row { display: flex; gap: 4px; flex-wrap: wrap; }
.side-btn {
  font-size: 11px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; color: var(--text-dim);
  transition: 0.15s; white-space: nowrap;
}
.side-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Responsive */
@media (min-width: 660px) {
  .modal { border-radius: 16px; margin-bottom: 40px; }
  .modal-overlay { align-items: center; }
}
@media (max-width: 640px) {
  .fab { bottom: 20px; right: 20px; }
  .sync-bar { flex-direction: column; align-items: stretch; }
  .sync-btns { justify-content: stretch; }
  .sync-btns .sync-btn { flex: 1; text-align: center; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🦐 <span>主人计划</span></h1>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="layout">
  <!-- ===== 左侧栏：日历 + 习惯 + 工具 ===== -->
  <div class="sidebar">
    <div class="section-title" style="font-size:12px;margin-bottom:8px;">📅 万年历</div>
    <div class="calendar" id="calendar"></div>

    <div class="side-section">
      <div class="side-section-title">今日习惯</div>
      <div class="side-habits" id="sideHabitList"></div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:4px;" id="sideHabitProgress"></div>
    </div>

    <div class="side-section">
      <div class="side-section-title">工具</div>
      <div class="side-btn-row" style="margin-bottom:6px;">
        <button class="side-btn" onclick="openLogModal()">📖 历史日志</button>
        <button class="side-btn" onclick="openSyncModal()">🔄 换电脑同步</button>
      </div>
      <div class="side-sync">
        <span id="sideSyncInfo">数据已自动保存</span> · <a href="#" onclick="openSyncModal()">同步说明</a>
      </div>
    </div>
  </div>

  <!-- ===== 右侧主区域：任务列表 ===== -->
  <div class="main">
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <div id="taskSections"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">＋</button>

<!-- Task Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">添加任务</h2>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>任务名称</label>
      <input type="text" id="taskTitle" placeholder="要做什么？" autofocus>
    </div>
    <div class="form-group">
      <label>截止日期（可选）</label>
      <input type="date" id="taskDate">
    </div>
    <div class="form-group">
      <label>循环（可选）</label>
      <select id="taskRecurrence" style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;outline:none;">
        <option value="">不循环</option>
        <option value="每天">🔄 每天</option>
        <option value="每周">🔄 每周</option>
        <option value="每月">🔄 每月</option>
        <option value="每季">🔄 每季</option>
        <option value="每年">🔄 每年</option>
      </select>
    </div>
    <div class="form-group">
      <label>备注（可选）</label>
      <textarea id="taskNote" placeholder="补充说明…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<!-- Habit Modal -->
<div class="modal-overlay" id="habitModal">
  <div class="modal">
    <h2>⚙️ 管理习惯</h2>
    <div id="habitModalList"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeHabitModal()">关闭</button>
      <button class="btn btn-primary" onclick="saveHabitChanges()">保存</button>
    </div>
  </div>
</div>

<!-- Log Modal -->

// ===== 工具函数 =====
function daysDiff(dateStr) {
  if (!dateStr) return Infinity;
  const t = new Date(today()), d = new Date(dateStr);
  return Math.round((d - t) / 86400000);
}

function endOfWeek() {
  const d = new Date(), day = d.getDay();
  return new Date(d.getTime() + (7 - day) * 86400000).toISOString().slice(0,10);
}

function dateTag(task) {
  if (task.recurrence) return '<span class="task-tag tag-recurring">🔄 ' + task.recurrence + '</span>';
  const diff = daysDiff(task.date);
  if (!task.date) return '';
  if (diff < 0) return '<span class="task-tag tag-overdue">已过期' + Math.abs(diff) + '天</span>';
  if (diff === 0) return '<span class="task-tag tag-today">今天</span>';
  if (diff === 1) return '<span class="task-tag tag-tomorrow">明天</span>';
  if (diff <= 7) return '<span class="task-tag tag-week">' + diff + '天后</span>';
  const m = new Date(task.date).getMonth()+1, d = new Date(task.date).getDate();
  return '<span class="task-tag tag-future">' + m + '月' + d + '日</span>';
}

function tomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

function categorize(tasks) {
  const t = today(), tmr = tomorrow(), we = endOfWeek();
  const r = {urgent:[], tomorrow:[], week:[], later:[], done:[]};
  tasks.forEach(tk => {
    if (tk.done) { r.done.push(tk); return; }
    if (tk.recurrence === '每天') {
      if (!tk.date || tk.date <= t) { r.urgent.push(tk); return; }
      if (tk.date === tmr) { r.tomorrow.push(tk); return; }
      r.later.push(tk); return;
    }
    if (tk.recurrence && !tk.date) { r.later.push(tk); return; }
    if (tk.date && tk.date <= t) { r.urgent.push(tk); return; }
    if (tk.date && tk.date === tmr) { r.tomorrow.push(tk); return; }
    if (tk.date && tk.date <= we) { r.week.push(tk); return; }
    r.later.push(tk);
  });
  return r;
}

  if (!tasks.length) return '<div class="empty">✨ 暂无</div>';
  return tasks.sort((a,b) => {
    if (a.date && b.date) return a.date.localeCompare(b.date);
    if (a.date) return -1;
    if (b.date) return 1;
    return 0;
  }).map(renderTask).join('');
}

function render() {
  const tasks = loadTasks(), habits = loadHabits();
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'];
  document.getElementById('headerDate').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + wd[now.getDay()];

  // Sidebar: Habits
  const active = habits.filter(h=>h.active).length;

    active ? active + '/' + habits.length + ' ✨ · <span style="cursor:pointer;text-decoration:underline;" onclick="openHabitModal()" title="管理习惯">⚙️ 管理</span>' : '0/' + habits.length + ' · <span style="cursor:pointer;text-decoration:underline;" onclick="openHabitModal()" title="管理习惯">⚙️ 管理</span>';
  const sideChips = habits.map(h =>
    '<div class="side-habit-chip ' + (h.active?'active':'') + '" onclick="toggleHabit(\'' + h.id + '\')">' + h.icon + ' ' + esc(h.name) + '</div>'
  ).join('');
  document.getElementById('sideHabitList').innerHTML = sideChips || '<span style="font-size:11px;color:var(--text-dim);">暂无，点击⚙️添加</span>';

  // Tasks
  var cat = categorize(tasks);
  // Apply calendar date filter
  if (_calFilter) {
    cat.urgent = cat.urgent.filter(function(tk) { return tk.date === _calFilter; });
    cat.tomorrow = cat.tomorrow.filter(function(tk) { return tk.date === _calFilter; });
    cat.week = cat.week.filter(function(tk) { return tk.date === _calFilter; });
    cat.later = cat.later.filter(function(tk) { return tk.date === _calFilter; });
    cat.done = cat.done.filter(function(tk) { return tk.doneDate === _calFilter; });
  }
  var sections = [
    { title: '🔴 今天', tasks: cat.urgent },
    { title: '🟠 明天', tasks: cat.tomorrow },
    { title: '🟡 本周', tasks: cat.week },
    { title: '🔵 以后再说', tasks: cat.later },
    { title: '✅ 已完成', tasks: cat.done },
  ];
  var logEntries = (getDailyLog()[today()] || []).length;

  // Filter header
  var filterBar = '';
  if (_calFilter) {
    filterBar = '<div style="margin-bottom:12px;padding:8px 14px;background:var(--accent-light);border-radius:10px;display:flex;align-items:center;justify-content:space-between;font-size:13px;">'
      + '<span>📅 筛选：<b>' + _calFilter + '</b> 的任务</span>'
      + '<button onclick="_calFilter=\'\';renderCalendar();render();" style="font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text-dim);">✕ 清除筛选</button>'
      + '</div>';
  }

  document.getElementById('taskSections').innerHTML = filterBar + sections.map(function(s) {
    if (s.title === '✅ 已完成' && !s.tasks.length && !logEntries && !_calFilter) return '';
    if (s.title === '✅ 已完成') {
      return '<div class="section">'
        + '<div class="section-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">'
        + '<span>✅ 已完成 <span style="font-weight:400;color:var(--text-dim)">' + s.tasks.length + '</span></span>'
        + '<button id="copyLogBtn" onclick="copyDailyLog()" style="font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--text-dim);background:none;cursor:pointer;color:var(--text-dim);">📋 复制今日清单' + (logEntries ? '（' + logEntries + '项）' : '') + '</button>'
        + '</div>'
        + (s.tasks.length ? '<div>' + renderList(s.tasks) + '</div>' : '')
        + '</div>';
    }
    return '<div class="section">'
      + '<div class="section-title">' + s.title + ' <span style="font-weight:400;color:var(--text-dim)">' + s.tasks.length + '</span></div>'
      + '<div>' + renderList(s.tasks) + '</div></div>';
  }).join('');

  // Calendar
  try { renderCalendar(); } catch(e) {
    document.getElementById('calendar').innerHTML = '<div style="padding:12px;font-size:12px;color:var(--red);">⚠️ 日历加载失败: ' + e.message + '</div>';
  }

// ===== Actions =====
function getDailyLog() {
  try { return JSON.parse(localStorage.getItem('xx_daily_log_v1') || '{}'); } catch(e) { return {}; }
}
function saveDailyLog(log) { localStorage.setItem('xx_daily_log_v1', JSON.stringify(log)); }
function addLogEntry(title) {
  const log = getDailyLog();
  const key = today();
  if (!log[key]) log[key] = [];
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  log[key].push({ time: hm, title: title });
  saveDailyLog(log);
}
function copyDailyLog() {
  const log = getDailyLog();
  const key = today();
  const entries = log[key] || [];
  if (!entries.length) { alert('今天还没有完成任何任务～'); return; }
  const lines = ['📋 ' + key + ' 今日完成（共 ' + entries.length + ' 项）', ''];
  entries.forEach(function(e) { lines.push('✓ ' + e.time + '  ' + e.title); });
  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.getElementById('copyLogBtn');
      if (btn) { btn.textContent = '✅ 已复制！'; setTimeout(function(){ btn.textContent = '📋 复制今日清单'; }, 1500); }
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    var btn2 = document.getElementById('copyLogBtn');
    if (btn2) { btn2.textContent = '✅ 已复制！'; setTimeout(function(){ btn2.textContent = '📋 复制今日清单'; }, 1500); }
  }
}

// ===== 日历 =====
var _calYear = 0, _calMonth = 0, _calFilter = '';
var _holidays = null, _holidaysFetched = false, _holidaysFetching = false;

function fetchHolidays(year) {
  if (_holidaysFetching) return;
  _holidaysFetching = true;
  var url = 'https://timor.tech/api/holiday/year/' + year + '/';
  // 先读缓存兜底
  try { var c = JSON.parse(localStorage.getItem('xx_holidays_' + year) || 'null'); if (c) _holidays = c; } catch(e) {}
  // 异步拉取，不阻塞渲染
  try {
    fetch(url, { signal: AbortSignal.timeout(5000) }).then(function(r) { return r.json(); }).then(function(data) {
      if (data && data.code === 0 && data.holiday) {
        _holidays = data.holiday;
        try { localStorage.setItem('xx_holidays_' + year, JSON.stringify(data.holiday)); } catch(e) {}
      }
    }).catch(function(){}).finally(function() {
      _holidaysFetched = true;
      _holidaysFetching = false;
      // 只有假日数据变了才重绘
      if (document.getElementById('calendar').childElementCount < 2) return;
      setTimeout(function(){ renderCalendar(); }, 0);
    });
  } catch(e) {
    _holidaysFetched = true;
    _holidaysFetching = false;
  }
}

function loadHolidays(year) {
  if (_holidays) return;
  try { _holidays = JSON.parse(localStorage.getItem('xx_holidays_' + year) || 'null'); } catch(e) {}
}

function getHolidayOn(y, m, d) {
  if (!_holidays) return null;
  var key = String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  return _holidays[key] || null;
}

function calNavMonth(delta) {
  _calMonth += delta;
  if (_calMonth > 12) { _calMonth = 1; _calYear++; }
  if (_calMonth < 1) { _calMonth = 12; _calYear--; }
  loadHolidays(_calYear);
  if (!_holidaysFetched && !_holidaysFetching) fetchHolidays(_calYear);
  renderCalendar();
}

function calGoToday() {
  var now = new Date();
  _calYear = now.getFullYear();
  _calMonth = now.getMonth() + 1;
  _calFilter = '';
  loadHolidays(_calYear);
  if (!_holidaysFetched && !_holidaysFetching) fetchHolidays(_calYear);
  renderCalendar();
  render();
}

function calClickDay(y, m, d) {
  var ds = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  _calFilter = (_calFilter === ds) ? '' : ds;
  renderCalendar();
  render();
}

function renderCalendar() {
  try {
  if (!_calYear) {
    var now = new Date();
    _calYear = now.getFullYear();
    _calMonth = now.getMonth() + 1;
    loadHolidays(_calYear);
    if (!_holidaysFetched && !_holidaysFetching) fetchHolidays(_calYear);
  }
  var today = new Date();
  var todayDS = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var wd = ['一','二','三','四','五','六','日'];
  var tasks = loadTasks();
  var taskMap = {};
  for (var ti = 0; ti < tasks.length; ti++) {
    var tk = tasks[ti];
    if (tk.done) continue;
    if (!tk.date) continue;
    if (!taskMap[tk.date]) taskMap[tk.date] = 0;
    taskMap[tk.date]++;
  }

  var html = '';
  html += '<div class="cal-nav">';
  html += '<button onclick="calNavMonth(-1)">‹</button>';
  html += '<div class="cal-nav-label">' + _calYear + '年 ' + _calMonth + '月</div>';
  html += '<button onclick="calNavMonth(1)">›</button>';
  html += '<button class="cal-nav-today" onclick="calGoToday()">今天</button>';
  html += '</div>';

  html += '<div class="cal-grid">';
  for (var i = 0; i < 7; i++) {
    html += '<div class="cal-weekday' + (i >= 5 ? ' weekend' : '') + '">' + wd[i] + '</div>';
  }

  var firstDay = new Date(_calYear, _calMonth - 1, 1);
  var firstDow = firstDay.getDay();
  var startOffset = firstDow === 0 ? 6 : firstDow - 1;
  var daysInMonth = new Date(_calYear, _calMonth, 0).getDate();
  var prevMonthDays = new Date(_calYear, _calMonth - 1, 0).getDate();

  // 预计算本月常用农历（节约 lookup）
  for (var cell = 0; cell < 42; cell++) {
    var d, m = _calMonth, y = _calYear, isOther = false;
    if (cell < startOffset) {
      d = prevMonthDays - startOffset + cell + 1;
      m = _calMonth - 1;
      if (m < 1) { m = 12; y--; }
      isOther = true;
    } else if (cell - startOffset >= daysInMonth) {
      d = cell - startOffset - daysInMonth + 1;
      m = _calMonth + 1;
      if (m > 12) { m = 1; y++; }
      isOther = true;
    } else {
      d = cell - startOffset + 1;
    }

    var ds = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var isToday = (ds === todayDS);
    var cellClass = 'cal-cell';
    if (isToday) cellClass += ' today';
    if (isOther) cellClass += ' other-month';
    if (ds === _calFilter) cellClass += ' selected';

    var hol = getHolidayOn(y, m, d);
    var lunar = solar2lunar(y, m, d);
    var lunarStr = lunar.dayStr;
    if (lunar.dayStr === '初一') lunarStr = lunar.monthStr + '月';
    if (lunar.lDay === 1 && lunar.lMonth === 1) lunarStr = '春节';
    if (lunar.dayStr === '腊月三十' || (lunar.dayStr === '三十' && lunar.monthStr === '腊')) lunarStr = '除夕';

    var festival = '';
    var mmdd = String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    if (solarFestivals[mmdd]) festival = solarFestivals[mmdd];
    else { var ff = getFloatFestival(y, m, d); if (ff) festival = ff; }
    if (!festival) {
      var lk = lunar.monthStr + '月' + lunar.dayStr;
      if (lunarFestivals[lk]) festival = lunarFestivals[lk];
      else { var term = getSolarTerm(y, m, d); if (term) festival = term; }
    }

    if (hol && hol.holiday) cellClass += ' holiday';
    if (hol && !hol.holiday && hol.name) cellClass += ' workday';

    var badgeHtml = '';
    var cnt = taskMap[ds] || 0;
    if (cnt > 0) {
      var isUrgent = (ds <= todayDS);
      var badgeClass = isUrgent ? 'urgent' : 'normal';
      badgeHtml = '<div class="cal-badges">';
      for (var bi = 0; bi < Math.min(cnt, 5); bi++) {
        badgeHtml += '<div class="cal-badge ' + badgeClass + '"></div>';
      }
      if (cnt > 5) badgeHtml += '<span style="font-size:8px;color:var(--text-dim);">+' + (cnt-5) + '</span>';
      badgeHtml += '</div>';
    }

    var lunarDisplay = lunarStr;
    if (hol && hol.holiday) lunarDisplay = hol.name || lunarStr;
    else if (hol && !hol.holiday && hol.name) lunarDisplay = hol.name || lunarStr;

    var festDisplay = '';
    if (festival && lunarDisplay !== festival) {
      festDisplay = '<div class="cal-festival">' + festival + '</div>';
    }

    html += '<div class="' + cellClass + '" onclick="calClickDay(' + y + ',' + m + ',' + d + ')">';
    html += '<div class="cal-solar">' + d + '</div>';
    html += '<div class="cal-lunar">' + lunarDisplay + '</div>';
    html += badgeHtml;
    html += festDisplay;
    html += '</div>';
  }
  html += '</div>';

  document.getElementById('calendar').innerHTML = html;
  } catch(e) {
    document.getElementById('calendar').innerHTML = '<div style="padding:12px;font-size:12px;color:var(--red);">⚠️ 日历出错: ' + e.message + '</div>';
  }
}

function toggleTask(id) {
  const d = loadTasks(), t = d.find(x=>x.id===id);
  if (!t) return;
  t.done = !t.done;
  t.doneDate = t.done ? today() : null;
  if (t.done) addLogEntry(t.title);
  if (t.done && t.recurrence && t.date) {
    const dt = new Date(t.date);
    if (t.recurrence === '每天') dt.setDate(dt.getDate()+1);
    else if (t.recurrence === '每周') dt.setDate(dt.getDate()+7);
    else if (t.recurrence === '每月') dt.setMonth(dt.getMonth()+1);
    else if (t.recurrence === '每季') dt.setMonth(dt.getMonth()+3);
    else if (t.recurrence === '每年') dt.setFullYear(dt.getFullYear()+1);
    t.date = dt.toISOString().slice(0,10);
    t.done = false;
    t.doneDate = null;
  }
  saveTasks(d); render();
}

function deleteTask(id) {
  const d = loadTasks().filter(t=>t.id!==id);
  saveTasks(d); render();
}

function editTask(id) {
  const t = loadTasks().find(x=>x.id===id);
  if (!t) return;
  document.getElementById('modalTitle').textContent = '编辑';
  document.getElementById('editId').value = id;
  document.getElementById('taskTitle').value = t.title;
  document.getElementById('taskDate').value = t.date||'';
  document.getElementById('taskRecurrence').value = t.recurrence||'';
  document.getElementById('taskNote').value = t.note||'';
  document.getElementById('modal').classList.add('show');
  document.getElementById('taskTitle').focus();
}

function openModal() {
  document.getElementById('modalTitle').textContent = '添加任务';
  document.getElementById('editId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDate').value = today();
  document.getElementById('taskNote').value = '';
  document.getElementById('taskRecurrence').value = '';
  document.getElementById('modal').classList.add('show');
  document.getElementById('taskTitle').focus();
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function saveTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { document.getElementById('taskTitle').style.borderColor='var(--red)'; return; }
  const editId = document.getElementById('editId').value;
  const obj = {
    title,
    date: document.getElementById('taskDate').value,
    recurrence: document.getElementById('taskRecurrence').value,
    note: document.getElementById('taskNote').value.trim(),
    done: false, doneDate: null,
  };
  const d = loadTasks();
  if (editId) {
    const idx = d.findIndex(t=>t.id===editId);
    if (idx !== -1) d[idx] = {...d[idx], ...obj};
  } else {
    obj.id = Date.now().toString();
    d.push(obj);
  }
  saveTasks(d); closeModal(); render();
}

function toggleHabit(id) {
  const d = loadHabits(), h = d.find(x=>x.id===id);
  if (h) { h.active = !h.active; saveHabits(d); render(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeHabitModal(); closeSyncModal(); }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) openModal();
});
</script>
</body>
</html>
